:root{
  --paper:#FFFFFF; --ink:#111111; --wine:#9F0049; --orange:#FC5912; --sky:#C5ECFF; --violet:#8E8EF7;
  --mist:#F3F3F0; --shade:rgba(17,17,17,.14);
  --j-permet:#6E6915; --j-exige:#9F0049; --j-oppose:#81CFF4; --permet:#6E6915; --exige:#9F0049; --oppose:#81CFF4;
  --f:"Arimo","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none;touch-action:manipulation}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
#vp{position:fixed;inset:0;overflow:hidden;touch-action:none;background:var(--paper);-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.mob{display:none!important}
#vp.panning{cursor:grabbing}
#vp.space,#vp.space .piece .sh path{cursor:grab}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.layer{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}

/* Cartes */
.piece{position:absolute;left:0;top:0;pointer-events:none}
.piece .sh{position:absolute;overflow:visible;pointer-events:none}
.piece .sh path{pointer-events:visiblePainted;cursor:grab}
.tool-link .piece .sh path{cursor:crosshair}
.tool-link #vp,.tool-link{cursor:crosshair}
.tool-link #Larrows *{pointer-events:none!important}
.piece.lift{filter:drop-shadow(0 30px 34px rgba(17,17,17,.24))}
.piece.lift .sh path{cursor:grabbing}
.piece.aimant{filter:drop-shadow(0 14px 26px rgba(17,17,17,.22))}
.piece.snapping{transition:transform .16s cubic-bezier(.2,.9,.3,1.25)}
.c{position:absolute;inset:0;--k:1;padding:var(--pt,76px) var(--pr,64px) 0 var(--pl,64px);color:var(--fg);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;box-sizing:border-box}
.num{font-weight:700;font-size:calc(58px*var(--k));line-height:1;letter-spacing:-.01em;margin-bottom:calc(38px*var(--k))}
.ttl{font-weight:500;font-size:calc(46px*var(--k));line-height:1.08;text-transform:uppercase;margin-bottom:calc(22px*var(--k));overflow-wrap:normal;word-break:normal;hyphens:manual}
.dsc{font-size:calc(23px*var(--k));line-height:1.3;white-space:pre-line;overflow-wrap:break-word}
.dsc b{font-weight:700}
.rule{height:1.5px;background:var(--fg);opacity:.5;margin-top:calc(32px*var(--k));flex:none}
.src{font-size:calc(18px*var(--k));opacity:.68;margin-top:calc(9px*var(--k));overflow-wrap:break-word}

/* Jonctions */
.badge{position:absolute;left:0;top:0;width:161px;height:161px;margin:-80.5px 0 0 -80.5px;border-radius:50%;display:grid;place-items:center;font-weight:500;pointer-events:auto;cursor:pointer;user-select:none;-webkit-user-select:none;line-height:1}
.badge.exige,.badge.permet{background:#fff;font-size:34px;letter-spacing:-.005em}
.badge.exige{color:var(--j-exige)}
.badge.permet{color:var(--j-permet)}
.badge.oppose{background:#fff;color:var(--j-oppose);font-size:28px;letter-spacing:-.01em}
.badge.vide{width:124px;height:124px;margin:-62px 0 0 -62px;background:#fff;font-size:0;box-shadow:0 10px 26px rgba(17,17,17,.2);transition:scale .15s ease,box-shadow .15s ease;animation:vide-in .22s cubic-bezier(.2,.9,.3,1.3)}
.badge.vide::before,.badge.vide::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:5px;margin:-2.5px 0 0 -22px;background:var(--ink);border-radius:3px}
.badge.vide::after{rotate:90deg}
.badge.vide:hover{scale:1.08;box-shadow:0 14px 32px rgba(17,17,17,.26)}
@keyframes vide-in{from{scale:.4;opacity:0}to{scale:1;opacity:1}}

/* Interface */
.panel{position:fixed;background:#fff;box-shadow:0 10px 34px var(--shade);z-index:20}
/* En haut à gauche : le logo, qui ouvre le menu (infos, manifeste, métaphore, sources) */
#head{top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:0;background:transparent;box-shadow:none;max-width:calc(100% - 32px);z-index:26}
#bMenu{display:flex;align-items:center;gap:10px;border:0;padding:7px 14px 7px 7px;background:#fff;box-shadow:0 10px 34px var(--shade);cursor:pointer;border-radius:18px}
#bMenu .katr{width:46px;height:46px;display:block;flex:none}
#bMenu .bg{width:22px;height:16px;position:relative;flex:none}
#bMenu .bg i{position:absolute;left:0;right:0;height:2.5px;border-radius:2px;background:var(--ink);transition:transform .2s ease,opacity .2s ease,top .2s ease}
#bMenu .bg i:nth-child(1){top:0}#bMenu .bg i:nth-child(2){top:6.75px}#bMenu .bg i:nth-child(3){top:13.5px}
#bMenu[aria-expanded="true"] .bg i:nth-child(1){top:6.75px;transform:rotate(45deg)}
#bMenu[aria-expanded="true"] .bg i:nth-child(2){opacity:0}
#bMenu[aria-expanded="true"] .bg i:nth-child(3){top:6.75px;transform:rotate(-45deg)}
#bMenu:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#menuPanel{position:absolute;left:0;top:calc(100% + 8px);width:288px;max-width:calc(100vw - 32px);max-height:calc(100vh - 100px);max-height:calc(100dvh - 100px);overflow:auto;background:#fff;box-shadow:0 18px 50px rgba(17,17,17,.22);padding:12px 6px 6px;box-sizing:border-box;animation:mp-in .18s cubic-bezier(.2,.9,.3,1);transform-origin:0 0}
@keyframes mp-in{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.mp-head{padding:0 10px 10px;display:flex;flex-direction:column;gap:3px}
#head h1{margin:0;font-size:15px;font-weight:500;line-height:1.2;letter-spacing:.02em;text-transform:uppercase}
#head .sub{font-size:12px;opacity:.65;line-height:1.3}
#head #prog{font-size:12px;margin-top:3px}
#head #sync{font-size:11px}
.mp-sp{height:1px;background:var(--ink);opacity:.1;margin:0 10px 4px}
.mp-it{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;padding:6px 8px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.mp-it:hover,.mp-it:focus-visible,.mp-it.on{background:var(--mist);outline:none}
.mp-it .dot{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:6px;font-weight:500;letter-spacing:0;text-transform:uppercase}
.mp-it .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.mp-it b{font-weight:700;font-size:13.5px}
.mp-it small{font-size:11.5px;opacity:.62;line-height:1.25}
.mp-it .ar{margin-left:auto;opacity:.35;flex:none}

/* Les cartes du menu, à l'identique du livrable */
.icard{position:relative;background:var(--bg);color:var(--ink);box-sizing:border-box;width:100%;padding:72px 46px 34px;font-family:var(--f)}
.badge2{position:absolute;z-index:2;left:50%;top:0;width:104px;height:104px;margin:0 0 0 -52px;border-radius:50%;background:var(--badge);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:500;letter-spacing:.01em;text-transform:uppercase}
.icard h2{margin:0 0 18px;font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-.005em}
.icard .st{margin:0 0 20px;font-size:19px;font-weight:400;line-height:1.28;text-transform:uppercase}
.icard p{margin:0 0 14px;font-size:15px;line-height:1.42}
.icard b{font-weight:700}
.icard .ft{border-top:1px solid rgba(17,17,17,.4);margin-top:22px;padding-top:9px;font-size:11.5px;opacity:.62}
.icard h3{margin:18px 0 4px;font-size:19px;font-weight:700}
.icard ul{margin:0;padding-left:20px;font-size:13.5px;line-height:1.42}
.icard li{padding-left:2px}
.icard li::marker{font-size:.8em}

.ic-wrap{position:relative;width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;padding-top:52px;box-sizing:border-box}

 /* Lot 6 : désaccords, clients, négociation */

/* ---------- Géométrie des contacts ---------- */
function edgeContact(A,B){
  if(overlap(A,B)) return null;
  const cfg=[
    [Math.abs(A.x+A.w-B.x)<EPS,'right','left','y',A.x+A.w],
    [Math.abs(B.x+B.w-A.x)<EPS,'left','right','y',A.x],
    [Math.abs(A.y+A.h-B.y)<EPS,'bottom','top','x',A.y+A.h],
    [Math.abs(B.y+B.h-A.y)<EPS,'top','bottom','x',A.y],
  ];
  for(const [hit,sa,sb,axis,line] of cfg){
    if(!hit) continue;
    const a0=axis==='y'?A.y:A.x, a1=a0+(axis==='y'?A.h:A.w);
    const b0=axis==='y'?B.y:B.x, b1=b0+(axis==='y'?B.h:B.w);
    const o0=Math.max(a0,b0), o1=Math.min(a1,b1);
    if(o1-o0<MINOV) continue;
    return {a:A.id,b:B.id,sa,sb,axis,line,o0,o1,key:key(A.id,B.id)};
  }
  return null;
}
function computeContacts(list){
  const out=[];
  for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){const c=edgeContact(list[i],list[j]);if(c)out.push(c);}
  return out;
}
function overlap(A,B,pad=0){
  return Math.min(A.x+A.w,B.x+B.w)-Math.max(A.x,B.x)>2-pad && Math.min(A.y+A.h,B.y+B.h)-Math.max(A.y,B.y)>2-pad;
}
function groupsOf(contacts){
  const par=new Map(); const f=x=>{while(par.has(x)&&par.get(x)!==x)x=par.get(x);return x;};
  S.pieces.forEach(p=>par.set(p.id,p.id));
  contacts.forEach(c=>{const a=f(c.a),b=f(c.b);if(a!==b)par.set(a,b);});
  const g=new Map(); S.pieces.forEach(p=>{const r=f(p.id);if(!g.has(r))g.set(r,new Set());g.get(r).add(p.id);});
  const of=new Map(); g.forEach(set=>set.forEach(id=>of.set(id,set))); return of;
}
const groupOf=(id,contacts=computeContacts(S.pieces))=>groupsOf(contacts).get(id)||new Set([id]);
function jointU(c,m){
  const L=c.o1-c.o0; let ju=m&&m.ju!=null?m.ju:L/2;
  ju=L<2*R+24?L/2:clamp(ju,R+12,L-R-12); return c.o0+ju;
}
function badgePos(c){
  const m=S.meta[c.key]||{};
  const u=m.joint?jointU(c,m):m.t!=null?c.o0+m.t*(c.o1-c.o0):(c.o0+c.o1)/2;
  return c.axis==='y'?{x:c.line,y:u}:{x:u,y:c.line};
}
/* Encoches de chaque carte : elles ne viennent que des emboîtements (et de l'aperçu en cours) */
function featuresMap(contacts,hv){
  const M=new Map(); const get=id=>{if(!M.has(id))M.set(id,{top:[],right:[],bottom:[],left:[],badge:new Set()});return M.get(id);};
  const add=(c,u,owner,r)=>{
    const A=byId(c.a),B=byId(c.b);
    for(const [P,side] of [[A,c.sa],[B,c.sb]]){
      const start=c.axis==='y'?P.y:P.x;
      get(P.id)[side].push({p:u-start,k:P.id===owner?'tab':'hole',r});
    }
  };
  for(const c of contacts){
    const m=S.meta[c.key]; if(!m||!byId(c.a)||!byId(c.b)) continue;
    if(m.joint) add(c,jointU(c,m),m.joint,R);
    /* une pastille sur la jointure : le texte des deux cartes s'en écarte */
    if(JTYPES.has(m.type)){get(c.a).badge.add(c.sa);get(c.b).badge.add(c.sb);}
  }
  if(hv&&hv.r>0.5){
    const A=byId(hv.a),B=byId(hv.b);
    if(A&&B){
      get(A.id)[hv.sa].push({p:hv.pa,k:'tab',r:hv.r});
      get(B.id)[hv.sb].push({p:hv.pb,k:'hole',r:hv.r});
    }
  }
  return M;
}
const EMPTY={top:[],right:[],bottom:[],left:[]};
function shapePath(p,f=EMPTY){
  const {w,h}=p, sw=q=>q.k==='tab'?1:0, rr=q=>q.r||R;
  let d='M0 0';
  [...f.top].sort((a,b)=>a.p-b.p).forEach(q=>{d+=` L${q.p-rr(q)} 0 A${rr(q)} ${rr(q)} 0 0 ${sw(q)} ${q.p+rr(q)} 0`;});
  d+=` L${w} 0`;
  [...f.right].sort((a,b)=>a.p-b.p).forEach(q=>{d+=` L${w} ${q.p-rr(q)} A${rr(q)} ${rr(q)} 0 0 ${sw(q)} ${w} ${q.p+rr(q)}`;});
  d+=` L${w} ${h}`;
  [...f.bottom].sort((a,b)=>b.p-a.p).forEach(q=>{d+=` L${q.p+rr(q)} ${h} A${rr(q)} ${rr(q)} 0 0 ${sw(q)} ${q.p-rr(q)} ${h}`;});
  d+=` L0 ${h}`;
  [...f.left].sort((a,b)=>b.p-a.p).forEach(q=>{d+=` L0 ${q.p+rr(q)} A${rr(q)} ${rr(q)} 0 0 ${sw(q)} 0 ${q.p-rr(q)}`;});
  return d+' Z';
}

/* ---------- Aimantation : n'importe quelle carte va avec n'importe quelle autre ---------- */
function facingCands(A,B,canResize){
  const out=[];
  for(const perp of [B.x-(A.x+A.w),(B.x+B.w)-A.x]){
    if(Math.abs(perp)>SNAP) continue;
    if(Math.min(A.y+A.h,B.y+B.h)-Math.max(A.y,B.y)<-SNAP) continue;

function tryCand(moving,others,cd,A,B){
  const mv=moving.map(m=>{const o={...m,x:m.x+cd.dx,y:m.y+cd.dy};if(m.id===A.id&&cd.h!=null)o.h=cd.h;return o;});
  const A2=mv.find(m=>m.id===A.id);
  if(mv.length===1) squareUp(A2,others,cd,B);
  for(const m of mv){
    for(const o of others) if(overlap(m,o)) return null;
    if(m!==A2&&cd.h!=null&&overlap(m,A2)) return null;

function findSnap(G,resizable){

    if(A.x>B.x+B.w+SNAP||B.x>A.x+A.w+SNAP||A.y>B.y+B.h+SNAP||B.y>A.y+A.h+SNAP) continue;

/* ---------- Historique et sauvegarde ---------- */
const snapshot=()=>JSON.stringify({pieces:S.pieces,meta:S.meta,arrows:S.arrows});
/* Historique par geste : on garde ce que MON geste a changé (cartes, flèches, jonctions), avant et après.
   Annuler ne remet que ces éléments-là : les gestes des autres joueurs restent intacts. */
let pendingBefore=null, pendingAt=0, applyingHist=false;
function pushHistory(s=snapshot()){if(!pendingBefore||Date.now()-pendingAt>3000){pendingBefore=s;pendingAt=Date.now();}}
function diffStates(b,a){
  const e={pieces:{},arrows:{},meta:{}}; let n=0;
  const one=(B,A,key)=>{const mb=new Map(B.map(x=>[x.id,x])),ma=new Map(A.map(x=>[x.id,x]));for(const id of new Set([...mb.keys(),...ma.keys()])){const x=mb.get(id)||null,y=ma.get(id)||null;if(JSON.stringify(x)!==JSON.stringify(y)){e[key][id]=[x,y];n++;}}};
  one(b.pieces||[],a.pieces,'pieces'); one(b.arrows||[],a.arrows,'arrows');
  const bm=b.meta||{}; for(const k of new Set([...Object.keys(bm),...Object.keys(a.meta)])){const x=bm[k]||null,y=a.meta[k]||null;if(JSON.stringify(x)!==JSON.stringify(y)){e.meta[k]=[x,y];n++;}}

function recordHistory(){
  if(!pendingBefore) return;

  const d=diffStates(b,{pieces:S.pieces,meta:S.meta,arrows:S.arrows});
  if(d){hist.push(clone(d));if(hist.length>150)hist.shift();redoStack.length=0;}
  updateHistBtns();
}
function applyEntry(e,idx){
  const put=(list,id,val)=>{const i=list.findIndex(x=>x.id===id);if(val){if(i>=0)list[i]=clone(val);else list.push(clone(val));}else if(i>=0)list.splice(i,1);};
  Object.entries(e.pieces).forEach(([id,v])=>put(S.pieces,id,v[idx]));
  Object.entries(e.arrows).forEach(([id,v])=>put(S.arrows,id,v[idx]));
  Object.entries(e.meta).forEach(([k,v])=>{if(v[idx])S.meta[k]=clone(v[idx]);else delete S.meta[k];});
}
function normalize(d){
  const pieces=(d.pieces||[]).map(p=>({id:p.id,num:p.num||'',title:p.title||'',desc:p.desc||'',src:p.src||'',color:p.color||'#9F0049',x:+p.x||0,y:+p.y||0,w:+p.w||445,h:+p.h||530,h0:+(p.h0||p.h)||530,w0:+(p.w0||p.w)||445}));

}
function loadState(d){
  S=normalize(d);

  if(sel&&sel.type==='arrow'&&!S.arrows.find(a=>a.id===sel.id)) sel=null;
  commit(false);
}
function undo(){const e=hist.pop();if(!e)return;pendingBefore=null;applyEntry(e,0);redoStack.push(e);applyingHist=true;commit(false);applyingHist=false;fixSel();updateHistBtns();}

function fixSel(){if(sel&&sel.type==='piece'&&!byId(sel.id))sel=null;if(sel&&sel.type==='arrow'&&!S.arrows.find(a=>a.id===sel.id))sel=null;renderSelbar();}
function updateHistBtns(){$('bUndo').disabled=!hist.length;$('bRedo').disabled=!redoStack.length;}
let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(STORE,snapshot());}catch(e){}},250);}
/* Une carte qui n'est plus collée à rien retrouve sa hauteur d'origine */
function tidy(){
  let c=computeContacts(S.pieces);
  const touched=new Set(); c.forEach(x=>{touched.add(x.a);touched.add(x.b);});
  let changed=false;
  S.pieces.forEach(p=>{if(touched.has(p.id)||remoteDrag.has(p.id))return;if(p.h0&&p.h!==p.h0){p.h=p.h0;changed=true;}if(p.w0&&p.w!==p.w0){p.w=p.w0;changed=true;}});
  if(changed) c=computeContacts(S.pieces);
  const ks=new Set(c.map(x=>x.key));
  Object.keys(S.meta).forEach(k=>{if(ks.has(k))return;const [a,b]=k.split('|');if(remoteDrag.has(a)||remoteDrag.has(b))return;delete S.meta[k];});

function commit(prune=true){
  if(sync.readOnly){pendingBefore=null;revertToRemote();toast('Tu peux regarder la partie, pas la modifier : demande à l’organisateur de te passer Contributeur.');return Promise.resolve();}
  if(prune)tidy();S.arrows=S.arrows.filter(a=>byId(a.from)&&byId(a.to));
  if(!applyingHist) recordHistory();

/* ---------- Partie ---------- */
function seeded(str){let h=2166136261;for(const c of String(str))h=Math.imul(h^c.charCodeAt(0),16777619);return ()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
function shuffleLayout(list,rnd=Math.random){
  const arr=list.map(p=>[rnd(),p]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  arr.forEach(p=>{if(p.h0)p.h=p.h0;if(p.w0)p.w=p.w0;});
  const maxW=Math.max(4800,Math.sqrt(arr.reduce((s,p)=>s+(p.w+340)*(p.h+340),0))*1.5);
  let x=0,y=0,rowH=0;
  for(const p of arr){
    if(x>0&&x+p.w>maxW){x=0;y+=rowH+300;rowH=0;}
    p.x=Math.round(x+rnd()*70); p.y=Math.round(y+rnd()*70);
    x+=p.w+340; rowH=Math.max(rowH,p.h);
  }
}
function newGame(){S={pieces:clone(BASE),meta:{},arrows:[]};shuffleLayout(S.pieces);}
function doShuffle(){

  toast('Pièces mélangées. Jonctions et flèches remises à zéro.',true);
}
function doSolution(){
  pushHistory();
  if(REF){
    const st=unpackBoard(REF.data), have=new Set(st.pieces.map(p=>p.id));
    const rest=S.pieces.filter(p=>!have.has(p.id)); let y=Math.min(...st.pieces.map(p=>p.y),0);
    rest.forEach(p=>{p.h=p.h0||p.h;p.w=p.w0||p.w;p.x=Math.min(...st.pieces.map(q=>q.x))-900-p.w;p.y=y;y+=p.h+260;});
    S={pieces:[...st.pieces,...rest],meta:st.meta,arrows:st.arrows}; sel=null; commit(false); fitView();
    toast('Voici la version de référence.',true); return;
  }
  const custom=S.pieces.filter(p=>!BASE_IDS.has(p.id));
  let y=417; custom.forEach(p=>{p.h=p.h0||p.h;p.w=p.w0||p.w;p.x=-900-p.w;p.y=y;y+=p.h+260;});
  S={pieces:[...clone(BASE),...custom],meta:clone(SOL_META),arrows:clone(SOL_ARROWS)}; sel=null; commit(false); fitView();

function solution(){
  if(REF){const st=unpackBoard(REF.data);return {pieces:st.pieces,rel:Object.entries(st.meta).filter(([,m])=>m&&m.type),arrows:st.arrows};}

}
function verify(){
  const SOLN=solution();

  const solC=computeContacts(SOLN.pieces), cur=new Set(computeContacts(S.pieces).map(c=>c.key));
  let asm=0,rel=0;
  const okKey=new Set();
  for(const c of solC){
    const [a,b]=c.key.split('|'), A=byId(a), B=byId(b);
    if(!(cur.has(c.key)&&A&&B)) continue;
    // même voisin, du même côté : la hauteur peut avoir bougé, on compare le côté de contact
    const sideSol=edgeContact(solP[a],solP[b]).sa, now=edgeContact(A,B);
    if(now&&now.sa===sideSol){asm++;okKey.add(c.key);}
  }
  for(const [k,m] of SOLN.rel) if(okKey.has(k)&&S.meta[k]&&S.meta[k].type===m.type) rel++;
  const arr=SOLN.arrows.filter(s=>S.arrows.some(a=>a.from===s.from&&a.to===s.to&&a.kw===s.kw)).length;
  return {asm,asmTot:solC.length,rel,relTot:SOLN.rel.length,arr,arrTot:SOLN.arrows.length};

/* ---------- Actions sur la sélection ---------- */
function select(s){sel=s;closePop();renderOverlay();renderSelbar();sendPresence({sel:s&&s.type==='piece'?s.id:null});}
/* Cherche, en spirale autour de la place visée, un endroit où le groupe ne touche aucune autre carte */
const FREE_GAP=90;
function clashes(rects,ignore){
  return rects.some(r=>S.pieces.some(o=>!ignore.has(o.id)&&o.x<r.x+r.w+FREE_GAP&&r.x<o.x+o.w+FREE_GAP&&o.y<r.y+r.h+FREE_GAP&&r.y<o.y+o.h+FREE_GAP));
}
function findFree(ids,prefAngle){
  const G=new Set(ids), base=[...G].map(id=>byId(id)).filter(Boolean);
  if(!clashes(base,G)) return {dx:0,dy:0};
  const a0=prefAngle==null?0:prefAngle;
  for(let r=140;r<=6000;r+=140){
    const n=Math.max(8,Math.round(r/90));
    for(let k=0;k<n;k++){
      const a=a0+(k%2?1:-1)*Math.ceil(k/2)*(2*Math.PI/n);
      const dx=Math.round(Math.cos(a)*r), dy=Math.round(Math.sin(a)*r);
      if(!clashes(base.map(p=>({x:p.x+dx,y:p.y+dy,w:p.w,h:p.h})),G)) return {dx,dy};
    }
  }
  return {dx:0,dy:0};
}
function moveToFree(ids,prefAngle){const d=findFree(ids,prefAngle);ids.forEach(id=>{const p=byId(id);if(p){p.x+=d.dx;p.y+=d.dy;}});return d;}
function nudgeFree(p){moveToFree([p.id],0);}
function deletePiece(id){
  const p=byId(id); if(!p) return;
  if(BASE_IDS.has(id)){toast('Les cartes du kit ne se suppriment pas. Range-la à l’écart ; la Bibliothèque la retrouve en un clic.');return;}
  pushHistory();
  putInTrash(p);
  S.pieces=S.pieces.filter(x=>x.id!==id);S.arrows=S.arrows.filter(a=>a.from!==id&&a.to!==id);sel=null;commit();
  toast('Carte mise à la corbeille. La Bibliothèque permet de la remettre.',true);
}
function duplicatePiece(id){
  const p=byId(id); if(!p) return; pushHistory();
  const c=clone(p); c.id=uid('u'); c.h=c.h0||c.h; c.w=c.w0||c.w; c.x=p.x+p.w+260; nudgeFree(c); S.pieces.push(c); sel={type:'piece',id:c.id}; commit();
}
function detachPiece(id){
  const G=groupOf(id); if(G.size<2) return; pushHistory();
  const p=byId(id), others=S.pieces.filter(o=>G.has(o.id)&&o.id!==id);
  const cx=others.reduce((s,o)=>s+o.x+o.w/2,0)/others.length, cy=others.reduce((s,o)=>s+o.y+o.h/2,0)/others.length;
  const ang=Math.atan2(p.y+p.h/2-cy,p.x+p.w/2-cx);
  p.x=Math.round(p.x+Math.cos(ang)*(SNAP+60)); p.y=Math.round(p.y+Math.sin(ang)*(SNAP+60));

/* ---------- Aperçu d'emboîtement : les bords se changent en encoches ---------- */
function setHint(sn){
  if(!sn){ if(hint){hint.target=0;hint.lastSn=null;animHint();} return; }
  const A2=sn.A2, B=byId(sn.b), c=sn.c, u=(c.o0+c.o1)/2;
  const st=P=>c.axis==='y'?P.y:P.x;
  const id=`${sn.a}|${sn.b}|${c.sa}`;
  if(!hint||hint.id!==id){
    hint={id,a:sn.a,b:sn.b,sa:c.sa,sb:c.sb,pa:u-st(A2),pb:u-st(B),r:hint&&hint.id===id?hint.r:0,target:R,t0:performance.now(),from:0};
  }else{hint.pa=u-st(A2);hint.pb=u-st(B);hint.target=R;}
  animHint();
}
let animRaf=0;
function animHint(){
  if(animRaf) return;
  const tick=()=>{
    animRaf=0; if(!hint) return;
    const goal=hint.target, d=goal-hint.r;
    hint.r=Math.abs(d)<.8?goal:hint.r+d*.28;
    if(hint.r<=.5&&goal===0){hint=null;}
    const c=computeContacts(S.pieces); renderPieces(c); renderOverlay(c);
    if(hint&&hint.r!==hint.target) animRaf=requestAnimationFrame(tick);
  };
  animRaf=requestAnimationFrame(tick);
}

/* ---------- Pointeur ---------- */
const vp=$('vp');
const capture=e=>{try{vp.setPointerCapture(e.pointerId);}catch(_){}};
function startPieceDrag(e,pid){
  const solo=e.altKey, contacts=computeContacts(S.pieces);
  const G=solo?new Set([pid]):groupOf(pid,contacts);
  S.pieces=[...S.pieces.filter(p=>!G.has(p.id)),...S.pieces.filter(p=>G.has(p.id))];
  sel={type:'piece',id:pid};
  const start=new Map([...G].map(id=>{const p=byId(id);return [id,{x:p.x,y:p.y}];}));
  drag={kind:'piece',pid,G,start,sx:e.clientX,sy:e.clientY,moved:false,snap:null,before:snapshot(),resizable:resizableIn(G,contacts)};
  if(e.pointerType==='touch'&&!solo){
    /* appui long : la carte se soulève seule. Relâchée sur place, elle ouvre son menu ; glissée, elle sort de son groupe */
    drag.touch=true;
    drag.lp=setTimeout(()=>{
      if(drag&&drag.kind==='piece'&&!drag.moved){
        drag.long=true; drag.wasGroup=drag.G.size>1;
        drag.G=new Set([pid]); drag.start=new Map([[pid,{x:byId(pid).x,y:byId(pid).y}]]); drag.resizable=new Set([pid]);
        els.get(pid)&&els.get(pid).classList.add('lift'); buzz();
      }
    },450);
  }
  renderPieces(contacts); renderOverlay(contacts); renderSelbar();
}
/* Une carte du groupe peut changer de hauteur si rien n'est collé au-dessus ou au-dessous d'elle */
function resizableIn(G,contacts){
  if(G.size===1) return new Set(G);
  const ok=new Set(G);
  contacts.forEach(c=>{if(G.has(c.a)&&G.has(c.b)&&c.axis==='x'){ok.delete(c.a);ok.delete(c.b);}});
  return ok;
}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(12);}catch(_){}};
let lastPtr='mouse', lastTap=null;
vp.addEventListener('pointerdown',e=>{
  lastPtr=e.pointerType;
  if(!$('modal').hidden) return;
  closePop();
  if(e.pointerType==='touch'){
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(touches.size===2){
      if(drag&&drag.lp) clearTimeout(drag.lp);
      if(drag&&drag.kind==='piece'){clearTimeout(drag.lp);drag.G.forEach(id=>{const s=drag.start.get(id),p=byId(id);p.x=s.x;p.y=s.y;els.get(id)&&els.get(id).classList.remove('lift');});hint=null;}
      const [a,b]=[...touches.values()];
      pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,view:{...view}}; drag=null; renderAll(); return;
    }
  }
  const t=e.target;
  const bk=t.closest&&t.closest('.badge'), pidEl=t.closest&&t.closest('[data-pid]'), aidEl=t.closest&&t.closest('[data-aid]');
  if(e.button===1||(e.button===0&&spaceDown)){drag={kind:'pan',sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty};vp.classList.add('panning');capture(e);return;}
  if(e.button!==0&&e.pointerType==='mouse') return;
  const hdEl=t.closest&&t.closest('.hd');
  if(hdEl&&e.button===0){
    drag={kind:'link',from:hdEl.dataset.hpid,cur:toWorld(e.clientX,e.clientY),target:null};
    hoverPid=null; renderHandles(); capture(e); renderOverlay(); return;
  }
  if(drag&&drag.pending){
    const T=pieceAt(toWorld(e.clientX,e.clientY),drag.from), from=drag.from; drag=null; setTool('move');

  if(bk){openJunctionPop(bk.dataset.k);return;}
  if(aidEl&&tool==='move'){select({type:'arrow',id:aidEl.dataset.aid});openArrowPop(aidEl.dataset.aid,e.clientX,e.clientY);return;}
  if(pidEl){
    const pid=pidEl.dataset.pid;
    if(tool==='link'){const w=toWorld(e.clientX,e.clientY);drag={kind:'link',from:pid,cur:w,target:null,pen:true,pts:[w]};sel=null;renderSelbar();}

    capture(e); return;

  if(sel) select(null);
  drag={kind:'pan',sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty};
  if(e.pointerType==='touch'){
    const d0=drag;
    d0.lp=setTimeout(()=>{if(drag===d0&&!d0.moved&&touches.size===1){drag=null;vp.classList.remove('panning');buzz();ctxBoard(d0.sx,d0.sy);}},520);

let raf=0;
vp.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'&&touches.has(e.pointerId)) touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(e.pointerType!=='touch'||drag){const w=toWorld(e.clientX,e.clientY);sendPresence({x:Math.round(w.x),y:Math.round(w.y)});}
  if(pinch&&touches.size>=2){
    const [a,b]=[...touches.values()], d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const s2=clamp(pinch.view.s*d/pinch.d,.04,2), wx=(pinch.mx-pinch.view.tx)/pinch.view.s, wy=(pinch.my-pinch.view.ty)/pinch.view.s;
    view={s:s2,tx:mx-wx*s2,ty:my-wy*s2}; userView=true; applyView(); return;
  }
  if(!drag){
    if(e.pointerType==='mouse'){const hd=e.target.closest&&e.target.closest('.hd');const P=hd?byId(hd.dataset.hpid):pieceAt(toWorld(e.clientX,e.clientY));setHover(P?P.id:null);}
    return;
  }
  if(drag.kind==='pan'){
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8){drag.moved=true;clearTimeout(drag.lp);}
    userView=true;view.tx=drag.tx+e.clientX-drag.sx;view.ty=drag.ty+e.clientY-drag.sy;applyView();return;}
  if(drag.kind==='link'){
    drag.cur=toWorld(e.clientX,e.clientY);
    if(drag.pen){const l=drag.pts[drag.pts.length-1];if(Math.hypot(drag.cur.x-l.x,drag.cur.y-l.y)>10/view.s&&drag.pts.length<600)drag.pts.push(drag.cur);}
    const T=pieceAt(drag.cur,drag.from); drag.target=T?T.id:null;
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;renderOverlay();});return;
  }
  if(drag.kind==='piece'){
    const dxs=e.clientX-drag.sx, dys=e.clientY-drag.sy;
    if(!drag.moved){if(Math.hypot(dxs,dys)<(drag.touch?9:4))return;drag.moved=true;clearTimeout(drag.lp);if(drag.long&&drag.wasGroup)toast('Pièce sortie de son groupe');drag.G.forEach(id=>els.get(id)&&els.get(id).classList.add('lift'));$('selbar').hidden=true;}
    const dx=dxs/view.s, dy=dys/view.s;
    drag.G.forEach(id=>{const s=drag.start.get(id),p=byId(id);p.x=s.x+dx;p.y=s.y+dy;});
    if(drag.G.size<=24) sendPresence({drag:[...drag.G].map(id=>{const p=byId(id);return [id,Math.round(p.x),Math.round(p.y)];})});
    if(!raf)raf=requestAnimationFrame(()=>{
      raf=0; if(!drag||drag.kind!=='piece') return;
      drag.snap=findSnap(drag.G,drag.resizable); setHint(drag.snap);
      const c=computeContacts(S.pieces); renderPieces(c); renderOverlay(c);
    });
  }
});
function endPointer(e){
  if(e.pointerType==='touch'){touches.delete(e.pointerId);if(pinch){if(touches.size<2)pinch=null;return;}}
  if(!drag) return;
  const d=drag; drag=null; vp.classList.remove('panning');
  if(d.lp) clearTimeout(d.lp);
  if(d.kind==='piece'){
    clearTimeout(d.lp); hint=null;
    d.G.forEach(id=>els.get(id)&&els.get(id).classList.remove('lift'));
    if(!d.moved){
      renderAll();sendPresence({drag:null});
      if(e.type==='pointerup'&&d.long) ctxPiece(d.pid,d.sx,d.sy);
      else if(e.type==='pointerup'&&d.touch){
        /* double tap = modifier, comme le double clic */
        const now=Date.now();
        if(lastTap&&lastTap.pid===d.pid&&now-lastTap.t<380&&Math.hypot(lastTap.x-d.sx,lastTap.y-d.sy)<40){lastTap=null;openEditor(d.pid);}
        else lastTap={pid:d.pid,t:now,x:d.sx,y:d.sy};
      }
      return;
    }
    const before=new Set(computeContacts(JSON.parse(d.before).pieces).map(c=>c.key));
    const sn=findSnap(d.G,d.resizable);
    d.G.forEach(id=>{const p=byId(id);if(sn){if(id===sn.a){p.x=sn.A2.x;p.y=sn.A2.y;p.w=sn.A2.w;p.h=sn.A2.h;}else{p.x+=sn.dx;p.y+=sn.dy;}}else{p.x=Math.round(p.x);p.y=Math.round(p.y);}});
    if(!sn){
      const mv=[...d.G].map(byId), others=S.pieces.filter(o=>!d.G.has(o.id));
      const hit=others.find(o=>mv.some(m=>overlap(m,o)));
      if(hit){
        const gx=mv.reduce((a,m)=>a+m.x+m.w/2,0)/mv.length, gy=mv.reduce((a,m)=>a+m.y+m.h/2,0)/mv.length;
        const ang=Math.atan2(gy-(hit.y+hit.h/2),gx-(hit.x+hit.w/2));
        moveToFree([...d.G],ang);
        d.G.forEach(id=>{const el=els.get(id);if(el){el.classList.add('snapping');setTimeout(()=>el.classList.remove('snapping'),200);}});
      }
    }
    if(sn) d.G.forEach(id=>{const el=els.get(id);if(el){el.classList.add('snapping');setTimeout(()=>el.classList.remove('snapping'),200);}});
    const fresh=computeContacts(S.pieces).filter(c=>!before.has(c.key)&&(d.G.has(c.a)!==d.G.has(c.b)));
    fresh.forEach(c=>{const owner=d.G.has(c.a)?c.a:c.b;S.meta[c.key]={...(S.meta[c.key]||{}),joint:owner,ju:(c.o1-c.o0)/2};});
    pushHistory(d.before); commit().then(()=>sendPresence({drag:null}),()=>sendPresence({drag:null}));
    if(fresh.length) setTimeout(()=>openJunctionPop(fresh[0].key),200);
  }else if(d.kind==='link'){
    const T=d.target?byId(d.target):pieceAt(toWorld(e.clientX,e.clientY),d.from);
    finishLink(d.from,T&&T.id,d.pen?[...d.pts,toWorld(e.clientX,e.clientY)]:null);
  }
}

vp.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!drag)sendPresence({x:null,y:null});});

/* ---------- Poser une flèche : poignées, carte visée, choix du mot ---------- */
/* la carte sous un point du plateau, celle du dessus d'abord (on ne demande pas au navigateur : une flèche ou une pastille pourrait masquer la carte) */
function pieceAt(w,except){for(let i=S.pieces.length-1;i>=0;i--){const p=S.pieces[i];if(p.id!==except&&w.x>=p.x-8&&w.x<=p.x+p.w+8&&w.y>=p.y-8&&w.y<=p.y+p.h+8)return p;}return null;}
let hoverPid=null, hoverOff=0;
function handlePid(){if(drag||!$('modal').hidden)return null;return hoverPid||(sel&&sel.type==='piece'?sel.id:null);}
function renderHandles(){
  const L=$('handles'); if(!L) return;
  const p=byId(handlePid()); let html='';
  if(p){
    const pts=[[p.x+p.w/2,p.y,0,-1],[p.x+p.w,p.y+p.h/2,1,0],[p.x+p.w/2,p.y+p.h,0,1],[p.x,p.y+p.h/2,-1,0]];
    html=pts.map(([x,y,dx,dy])=>{const sp=toScreen(x,y);return `<button class="hd" data-hpid="${p.id}" style="left:${(sp.x+dx*18).toFixed(1)}px;top:${(sp.y+dy*18).toFixed(1)}px" title="Tirer une flèche vers une autre carte" aria-label="Tirer une flèche depuis cette carte"></button>`;}).join('');

function setHover(pid){

  else if(hoverPid&&!hoverOff){hoverOff=setTimeout(()=>{hoverOff=0;hoverPid=null;renderHandles();},450);}
}
function arrowMid(a){
  const g=arrowGeom(a); if(!g) return null;
  if(a.route&&a.route.length){const P=routedPoints(a,g);return P[Math.floor(P.length/2)];}
  const t=.5,u=.5; return {x:u*u*u*g.s.x+3*u*u*t*g.t1.x+3*u*t*t*g.t2.x+t*t*t*g.e.x, y:u*u*u*g.s.y+3*u*u*t*g.t1.y+3*u*t*t*g.t2.y+t*t*t*g.e.y};
}
function openArrowPop(aid,sx,sy){
  const a=S.arrows.find(x=>x.id===aid); if(!a) return;
  if(sx==null){const m=arrowMid(a);if(!m)return;const sp=toScreen(m.x,m.y);sx=sp.x;sy=sp.y;}
  const A=byId(a.from), pop=$('pop');
  pop.innerHTML=`<span class="lbl">${esc((A&&A.title)||'Cette carte')}…</span>`+
    Object.entries(KW).map(([k,v])=>`<button class="chip${a.kw===k?' on':''}" data-akw="${k}"><i style="background:${v.line}"></i>${v.word}</button>`).join('')+
    (a.route?`<button class="btn" data-aact="straight" title="Redresser la flèche">Redresser</button>`:'')+
    `<button class="btn" data-aact="swap" title="Inverser le sens">⇄</button><button class="btn" data-aact="del" title="Supprimer la flèche">Supprimer</button>`;

/* le tracé est gardé relatif aux deux bouts : la flèche garde sa forme quand les cartes bougent */
function simplify(pts,tol){
  if(pts.length<3) return pts.slice();
  const seg=(p,a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy||1;let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L;t=clamp(t,0,1);return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy);};
  let iMax=0,dMax=0;for(let i=1;i<pts.length-1;i++){const d=seg(pts[i],pts[0],pts[pts.length-1]);if(d>dMax){dMax=d;iMax=i;}}
  if(dMax<=tol) return [pts[0],pts[pts.length-1]];
  const l=simplify(pts.slice(0,iMax+1),tol), r=simplify(pts.slice(iMax),tol); return [...l.slice(0,-1),...r];
}
function routeFrom(a,pts){
  const RA=grow(byId(a.from),GAP), RB=grow(byId(a.to),GAP);
  const inside=(r,p)=>p.x>r.x1&&p.x<r.x2&&p.y>r.y1&&p.y<r.y2;
  /* là où le trait quitte la première carte, là où il entre dans la seconde */
  const iOut=pts.findIndex(p=>!inside(RA,p)); if(iOut<1) return null;
  let iIn=-1; for(let i=iOut;i<pts.length;i++) if(inside(RB,pts[i])){iIn=i;break;}
  if(iIn<1) return null;
  const sPt=exitPt(RA,pts[iOut-1],pts[iOut]), ePt=exitPt(RB,pts[iIn],pts[iIn-1]);
  a.as=anchorOf(RA,sPt); a.ae=anchorOf(RB,ePt);
  const g={s:anchorPt(RA,a.as),e:anchorPt(RB,a.ae)};
  const mid=simplify([g.s,...pts.slice(iOut,iIn).filter(p=>!inside(RA,p)&&!inside(RB,p)),g.e],40).slice(1,-1).slice(0,12);
  const d={x:g.e.x-g.s.x,y:g.e.y-g.s.y}, L2=d.x*d.x+d.y*d.y; if(L2<1||!mid.length){delete a.as;delete a.ae;return null;}
  const r=mid.map(p=>{const q={x:p.x-g.s.x,y:p.y-g.s.y};return [+((q.x*d.x+q.y*d.y)/L2).toFixed(3),+((q.x*-d.y+q.y*d.x)/L2).toFixed(3)];})
    .filter(([u])=>u>0.04&&u<0.96);
  return r.length?r:null;
}
function swapArrow(a){const f=a.from;a.from=a.to;a.to=f;if(a.route){a.route=a.route.map(([u,v])=>[+(1-u).toFixed(3),-v]).reverse();const t=a.as;a.as=a.ae;a.ae=t;}}
function finishLink(from,to,pts){
  if(!to||to===from||!byId(from)||!byId(to)){renderOverlay();return;}
  pushHistory();
  const a={id:uid('a'),from,to,kw:'permet',flip:false};
  if(pts&&pts.length>3){const r=routeFrom(a,pts);if(r)a.route=r;else{delete a.as;delete a.ae;}}
  S.arrows.push(a); sel={type:'arrow',id:a.id}; commit();
  setTimeout(()=>openArrowPop(a.id),60);
}

/* ---------- Clavier ---------- */
const typing=e=>/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
window.addEventListener('keydown',e=>{
  if(!$('ctx').hidden){
    if(e.key==='Escape'){closeCtx();return;}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const its=[...$('ctx').querySelectorAll('.it')],i=its.indexOf(document.activeElement);(its[(i+(e.key==='ArrowDown'?1:-1)+its.length)%its.length]||its[0]).focus();return;}
  }
  if(e.key==='Escape'){closePop();if(!$('modal').hidden){closeModal();return;}if(drag&&drag.kind==='link'){drag=null;renderOverlay();}setTool('move');if(sel)select(null);return;}
  if(!$('modal').hidden||typing(e)) return;
  const mod=e.metaKey||e.ctrlKey, k=e.key.toLowerCase();
  if(e.key===' '){spaceDown=true;vp.classList.add('space');e.preventDefault();return;}
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==='y'){e.preventDefault();redo();return;}
  if(mod&&k==='d'){e.preventDefault();if(sel&&sel.type==='piece')duplicatePiece(sel.id);return;}
  if(mod) return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSel();}
  else if(k==='v') setTool('move');
  else if(k==='l'||k==='p') setTool(tool==='link'?'move':'link');
  else if(k==='n') openEditor(null);
  else if(k==='b') openLibrary();
  else if(e.key==='Enter'&&sel&&sel.type==='piece') openEditor(sel.id);
  else if(e.key==='+'||e.key==='=') zoomAt(innerWidth/2,innerHeight/2,1.25);
  else if(e.key==='-') zoomAt(innerWidth/2,innerHeight/2,.8);
  else if(e.key==='0') fitView();
});
window.addEventListener('keyup',e=>{if(e.key===' '){spaceDown=false;vp.classList.remove('space');}});

  const t=$('toast'); t.innerHTML=`<span>${esc(msg)}</span>${withUndo?'<button type="button" id="tUndo">Annuler</button>':''}`;

function readEd(){
  const card=$('edCard'); if(!card||!editor) return;
  card.querySelectorAll('[data-f]').forEach(el=>{
    const v=el.innerText.replace(/ /g,' ').replace(/\n{3,}/g,'\n\n');
    const f={num:'num',ttl:'title',dsc:'desc',src:'src'}[el.dataset.f];
    editor.d[f]=f==='desc'?v.trim():v.replace(/\n/g,' ').trim();
  });
}
function renderEdCard(focus){
  const d=editor.d, card=$('edCard'), stage=card.parentElement;
  const availW=Math.max(240,Math.min(560,stage.clientWidth-56)), availH=Math.max(260,Math.min(520,innerHeight*.62));
  const s=Math.min(availW/d.w,availH/d.h,1.1);
  card.style.width=d.w*s+'px'; card.style.height=d.h*s+'px';
  card.innerHTML=`<div class="piece" style="width:${d.w}px;height:${d.h}px;transform:scale(${s});transform-origin:0 0">${pieceInner(d,EMPTY,true)}</div>`;
  const pc=card.firstElementChild, pb=pads(d,EMPTY).pb;
  const refit=()=>fitText(pc,d,pb);
  card.querySelectorAll('[contenteditable]').forEach(el=>{
    if(el.contentEditable!=='plaintext-only') el.contentEditable='true';
    el.addEventListener('input',()=>{if(!el.textContent)el.innerHTML='';refit();});
    el.addEventListener('paste',ev=>{ev.preventDefault();const t=(ev.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t);});
    el.addEventListener('keydown',ev=>{

function putInTrash(p){
  const item={...pieceData(p),id:p.id,at:new Date().toISOString(),by:me?me.name:''};
  TRASH=[item,...TRASH.filter(t=>t.id!==p.id)].slice(0,40);

function takeFromTrash(id){

const LS_SAVES='puzzle-manager-versions', LS_REF='puzzle-manager-reference';
/* un plateau compact : les cartes du kit ne gardent que leur place, les cartes créées gardent tout */
function packBoard(){
  return {p:S.pieces.filter(x=>BASE_IDS.has(x.id)).map(x=>[x.id,Math.round(x.x),Math.round(x.y),x.w,x.h]),
    c:S.pieces.filter(x=>!BASE_IDS.has(x.id)).map(x=>pieceData(x)&&{id:x.id,...pieceData(x)}),meta:clone(S.meta),arrows:clone(S.arrows)};
}
function unpackBoard(d){
  const pieces=[];
  (Array.isArray(d&&d.p)?d.p:[]).forEach(r=>{if(!Array.isArray(r))return;const b=BASE.find(x=>x.id===r[0]);if(!b)return;const cur=byId(b.id)||b;
    pieces.push({...clone(cur),x:+r[1]||0,y:+r[2]||0,w:clamp(+r[3]||b.w,200,2000),h:clamp(+r[4]||b.h,200,2000),w0:cur.w0||b.w,h0:cur.h0||b.h});});
  (Array.isArray(d&&d.c)?d.c:[]).forEach(c=>{if(c&&typeof c.id==='string'&&/^[A-Za-z0-9_.~:@+-]{1,80}$/.test(c.id))pieces.push(cleanPiece(c.id,c));});
  const L=cleanLinks({meta:d&&d.meta,arrows:d&&d.arrows});
  return {pieces,meta:L.meta,arrows:L.arrows};
}
const verId=()=>'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

function writeLocal(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(_){}}
async function saveVersion(name){
  const v={name:String(name||'').slice(0,60)||defaultVersionName(),at:new Date().toISOString(),by:me?me.name:'',data:packBoard()};

  else{const l=readLocal(LS_SAVES,[]);l.unshift({id,...v});writeLocal(LS_SAVES,l.slice(0,30));SAVES=l.slice(0,30);}

}
async function deleteVersion(id){

/* Applique l'état de la base, sauf ce que ce poste est en train d'écrire ou de tenir en main */
function applyRemote(force){

  const rp=remoteCache.pieces; let changed=false;
  const list=[];
  for(const p of S.pieces){

      if((!force||remoteDrag.has(p.id))&&(held.has(p.id)||sync.dirty.has(p.id))){list.push(p);continue;}
      const n=rp.get(p.id); if(JSON.stringify(pieceData(p))!==JSON.stringify(pieceData(n)))changed=true; list.push(n);
    }else if(!force&&(sync.dirty.has(p.id)||held.has(p.id))) list.push(p);

/* Ce qui vient de la base est écrit par d'autres : on ne garde que des valeurs bien formées */
function cleanLinks(v){

  if(v&&v.meta&&typeof v.meta==='object') for(const [k,m] of Object.entries(v.meta)){
    const [a,b]=k.split('|'); if(!idOk(a)||!idOk(b)||!m||typeof m!=='object') continue;
    const o={}; if(JTYPES.has(m.type)) o.type=m.type;
    if(idOk(m.joint)&&(m.joint===a||m.joint===b)){o.joint=m.joint;if(isFinite(m.ju))o.ju=+m.ju;}
    if(isFinite(m.t)) o.t=clamp(+m.t,0,1);
    meta[k]=o;
  }
  const okRoute=r=>Array.isArray(r)&&r.length&&r.length<=12&&r.every(p=>Array.isArray(p)&&p.length===2&&isFinite(p[0])&&isFinite(p[1]));
  const arrows=(Array.isArray(v&&v.arrows)?v.arrows:[]).filter(a=>a&&idOk(a.id)&&idOk(a.from)&&idOk(a.to)&&KW[a.kw]).slice(0,200).map(a=>{const o={id:a.id,from:a.from,to:a.to,kw:a.kw,flip:!!a.flip};const okA=x=>Array.isArray(x)&&x.length===2&&[0,1,2,3].includes(x[0])&&isFinite(x[1]);
    if(okRoute(a.route)&&okA(a.as)&&okA(a.ae)){o.route=a.route.map(([u,v])=>[clamp(+u,-3,3),clamp(+v,-3,3)]);o.as=[a.as[0],clamp(+a.as[1],0,1)];o.ae=[a.ae[0],clamp(+a.ae[1],0,1)];}return o;});
  return {meta,arrows};
}
/* ---------- En ligne : Supabase joue le rôle de la base partagée et de la salle ---------- */
const BOARD=(()=>{try{const b=new URLSearchParams(location.search).get('b');return b&&/^[a-z0-9-]{1,40}$/.test(b)?b:'cours';}catch(_){return 'cours';}})();
function makeOnline(cfg){
  const sb=window.supabase.createClient(cfg.url,cfg.key,{realtime:{params:{eventsPerSecond:20}}});
  const T='puzzle_items';
  /* une ligne par carte (kind piece) ; jonctions, référence et versions en lignes « links » nommées */
  const rows=new Map(); const lis={piece:new Set(),saves:new Set(),docs:new Map()}; let loaded=false, loading=null;
  const keyOf=(col,id)=>col==='pieces'?id:col==='saves'?'save-'+id:id;
  const kindOf=col=>col==='pieces'?'piece':'links';
  const META={fromCache:false,hasPendingWrites:false};
  const snapPieces=()=>{const docs=[...rows.values()].filter(r=>r.kind==='piece').map(r=>({id:r.id,exists:true,data:()=>r.data}));return {docs,size:docs.length,empty:!docs.length,metadata:META,docChanges:()=>[]};};
  const snapSaves=()=>{const docs=[...rows.values()].filter(r=>r.kind!=='piece'&&String(r.id).startsWith('save-')).map(r=>({id:r.id.slice(5),exists:true,data:()=>r.data}));return {docs,size:docs.length,empty:!docs.length,metadata:META,docChanges:()=>[]};};
  const snapDoc=k=>{const r=rows.get(k);return {id:k,exists:!!r,data:()=>r&&r.data,metadata:META};};
  let emitT=0;
  const emit=()=>{if(!loaded||emitT)return;emitT=setTimeout(()=>{emitT=0;lis.piece.forEach(f=>f(snapPieces()));lis.saves.forEach(f=>f(snapSaves()));lis.docs.forEach((set,k)=>set.forEach(f=>f(snapDoc(k))));},40);};
  const load=()=>loading||(loading=(async()=>{
    sb.channel('db:'+BOARD).on('postgres_changes',{event:'*',schema:'public',table:T},pl=>{
      const r=pl.eventType==='DELETE'?pl.old:pl.new; if(!r||r.board!==BOARD)return;
      if(pl.eventType==='DELETE')rows.delete(r.id);else rows.set(r.id,r); emit();
    }).subscribe();
    const {data,error}=await sb.from(T).select('id,kind,data,board').eq('board',BOARD);
    if(error) throw error;
    data.forEach(r=>rows.set(r.id,r)); loaded=true; emit();
  })());
  const fail=e=>{const m=String(e&&(e.message||e.code)||'');return {code:/permission|denied|policy|42501/i.test(m)?'not_granted':'unavailable',message:m};};
  const docRef=path=>{
    const [col,id]=path.split('/'), k=keyOf(col,id), kind=kindOf(col);
    return {
      async set(data){const {error}=await sb.from(T).upsert({board:BOARD,kind,id:k,data,updated_at:new Date().toISOString()});if(error)throw fail(error);rows.set(k,{board:BOARD,kind,id:k,data});emit();},
      async delete(){const {error}=await sb.from(T).delete().eq('board',BOARD).eq('id',k);if(error)throw fail(error);rows.delete(k);emit();},
      onSnapshot(next,err){if(!lis.docs.has(k))lis.docs.set(k,new Set());lis.docs.get(k).add(next);load().then(()=>next(snapDoc(k)),e=>err&&err(fail(e)));return ()=>lis.docs.get(k).delete(next);}
    };
  };

  async function batch(sets,dels){
    const now=new Date().toISOString();
    if(sets.length){
      const body=sets.map(([col,id,data])=>({board:BOARD,kind:kindOf(col),id:keyOf(col,id),data,updated_at:now}));
      const {error}=await sb.from(T).upsert(body); if(error) throw fail(error);
      body.forEach(r=>rows.set(r.id,r));
    }
    if(dels.length){const {error}=await sb.from(T).delete().eq('board',BOARD).in('id',dels);if(error)throw fail(error);dels.forEach(id=>rows.delete(id));}
  }
  const db={batch,doc:docRef,collection:name=>({onSnapshot(next,err){const set=name==='saves'?lis.saves:lis.piece;set.add(next);load().then(()=>next(name==='saves'?snapSaves():snapPieces()),e=>err&&err(fail(e)));return ()=>set.delete(next);}})};

  /* Salle : qui est là (presence) et où est chacun (broadcast, dix fois par seconde au plus) */
  const myPeer=Math.random().toString(36).slice(2,12);
  const ch=sb.channel('room:'+BOARD,{config:{presence:{key:myPeer},broadcast:{self:false}}});
  let mine={}, sendT=0, lastSent=0, joined=false; const state=new Map(); const peerFns=new Set();
  const list=()=>{
    const ps=ch.presenceState(); const out=[];
    for(const k of Object.keys(ps)){
      const base=(ps[k]&&ps[k][0])||{}; const live=state.get(k)||{};
      out.push({peer:k,sameTab:k===myPeer,isMe:k===myPeer,kind:'viewer',guest:false,by:null,presence:k===myPeer?mine:{...base,...live.p},updatedAt:live.t||Date.now()});
    }

  ch.on('broadcast',{event:'p'},msg=>{const pl=msg.payload||{};const k=pl.__k;if(!k||k===myPeer)return;const o={...pl};delete o.__k;state.set(k,{p:o,t:Date.now()});notify();});

  ch.on('presence',{event:'leave'},({key})=>{state.delete(key);notify();});
  ch.subscribe(async st=>{if(st==='SUBSCRIBED'){joined=true;await ch.track({name:mine.name||'',color:mine.color||''});mine.__k=myPeer;flush();notify();}});
  const room={
    presence(patch){

      mine.__k=myPeer;
      if('name' in patch||'color' in patch){if(joined)ch.track({name:mine.name||'',color:mine.color||''});}
      if(!sendT){const wait=Math.max(0,60-(Date.now()-lastSent));sendT=setTimeout(flush,wait);}

    },
    onPeers(fn){peerFns.add(fn);setTimeout(notify,0);return ()=>peerFns.delete(fn);},
  };

}

function applyPeers(){

  const box=$('people'); if(!box) return;
  const others=peers.filter(p=>!p.sameTab&&p.kind==='viewer');
  if(!sync.room&&!me){box.innerHTML='';return;}
  let html='';
  if(me) html+=`<button class="av me" data-me="1" style="background:${me.color};color:${fgOf(me.color)}" title="${esc(me.name)} (toi) : changer de prénom ou de couleur">${esc(initials(me.name))}</button>`;
  others.slice(0,6).forEach(pr=>{const c=peerColor(pr);html+=`<button class="av" data-peer="${esc(pr.peer)}" style="background:${c};color:${fgOf(c)}" title="${esc(peerName(pr))} : aller à son curseur">${esc(initials(peerName(pr)))}</button>`;});
  if(others.length>6) html+=`<span class="more">+${others.length-6}</span>`;
  if(box._html!==html){box._html=html;box.innerHTML=html;}
}
$('people').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.me){openIntro();return;}
  const pr=peers.find(p=>p.peer===b.dataset.peer), ps=pr&&pr.presence;
  if(ps&&isFinite(ps.x)&&isFinite(ps.y)&&ps.x!==null){userView=true;const sp=toScreen(+ps.x,+ps.y);view.tx+=innerWidth/2-sp.x;view.ty+=innerHeight/2-sp.y;applyView();}
  else toast(`${peerName(pr||{})} n’a pas encore bougé sa souris sur le plateau.`);
});

/* ---------- Démarrage ---------- */
function start(data){
  let d=data&&data.S;
  if(!d){try{const raw=localStorage.getItem(STORE);if(raw)d=JSON.parse(raw);}catch(_){d=null;}}
  if(d&&Array.isArray(d.pieces)&&d.pieces.length) S=normalize(d); else newGame();
  renderAll();
  if(data&&data.view){view=data.view;applyView();}else fitView();
  if(!me) openIntro();
  SAVES=readLocal(LS_SAVES,[]); REF=readLocal(LS_REF,null); TRASH=readLocal(LS_TRASH,[]); updateProgress();
  initCollab();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({S:JSON.parse(snapshot()),view}));}catch(_){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(start);
else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
window.__puzzle={S:()=>S,verify,computeContacts,BASE,doSolution,findSnap,byId,commit,resizableIn};
})();
</script>
