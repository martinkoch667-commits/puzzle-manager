/* ---------- Plateau partagé (db) ---------- */
const validColor=c=>typeof c==='string'&&/^#[0-9A-Fa-f]{6}$/.test(c);
const pieceData=p=>({num:p.num,title:p.title,desc:p.desc,src:p.src,color:p.color,x:Math.round(p.x*100)/100,y:Math.round(p.y*100)/100,w:p.w,h:p.h,w0:p.w0||p.w,h0:p.h0||p.h});
const cleanPiece=(id,d)=>({id,num:String(d.num||'').slice(0,6),title:String(d.title||'').slice(0,80),desc:String(d.desc||'').slice(0,600),src:String(d.src||'').slice(0,120),
  color:validColor(d.color)?d.color:'#9F0049',x:+d.x||0,y:+d.y||0,w:clamp(+d.w||445,200,2000),h:clamp(+d.h||530,200,2000),w0:clamp(+(d.w0||d.w)||445,200,2000),h0:clamp(+(d.h0||d.h)||530,200,2000)});
function setSyncLabel(t,ok){const el=$('sync');el.hidden=false;el.classList.toggle('off',!ok);$('syncTxt').textContent=window.PUZZLE_ONLINE&&ok&&t==='Plateau partagé'?'Plateau « '+BOARD+' » en ligne':t;}
function pushRemote(){
  if(!sync.db||!sync.ready) return Promise.resolve();
  const cur=new Map(S.pieces.map(p=>[p.id,JSON.stringify(pieceData(p))]));
  for(const [id,js] of cur) if(sync.remote[id]!==js&&!remoteDrag.has(id)) sync.dirty.add(id);
  for(const id of Object.keys(sync.remote)) if(!cur.has(id)) sync.gone.add(id);
  const lj=JSON.stringify({meta:S.meta,arrows:S.arrows}); if(lj!==sync.links) sync.linksDirty=true;
  if(sync.db.batch){
    sync.queue=sync.queue.then(async()=>{
      const sets=[], dels=[], sent=new Map();
      const taken=[...sync.dirty];
      for(const id of taken){const p=byId(id);if(!p||remoteDrag.has(id))continue;const js=JSON.stringify(pieceData(p));if(sync.remote[id]===js)continue;sets.push(['pieces',id,JSON.parse(js)]);sent.set(id,js);}
      const release=()=>taken.forEach(id=>{const p=byId(id);if(!p||!sent.has(id)||JSON.stringify(pieceData(p))===sent.get(id))sync.dirty.delete(id);});
      for(const id of [...sync.gone]){sync.gone.delete(id);if(!byId(id))dels.push(id);}
      let links=null;
      if(sync.linksDirty){sync.linksDirty=false;const now=JSON.stringify({meta:S.meta,arrows:S.arrows});if(now!==sync.links){links=now;sets.push(['board','links',JSON.parse(now)]);}}
      if(!sets.length&&!dels.length){release();return;}
      try{await sync.db.batch(sets,dels);sent.forEach((js,id)=>{sync.remote[id]=js;});dels.forEach(id=>{delete sync.remote[id];});if(links)sync.links=links;}
      catch(e){writeFailed(e);}
      release();
      if(sync.dirty.size) pushRemote();
    }).catch(()=>{});
    return sync.queue;
  }
  sync.queue=sync.queue.then(async()=>{
    for(const id of [...sync.dirty]){
      const p=byId(id); if(!p||remoteDrag.has(id)){sync.dirty.delete(id);continue;}
      const js=JSON.stringify(pieceData(p));
      if(sync.remote[id]===js){sync.dirty.delete(id);continue;}
      try{await sync.db.doc('pieces/'+id).set(JSON.parse(js));sync.remote[id]=js;}catch(e){writeFailed(e);}
      sync.dirty.delete(id);
    }
    for(const id of [...sync.gone]){
      if(byId(id)){sync.gone.delete(id);continue;}
      try{await sync.db.doc('pieces/'+id).delete();delete sync.remote[id];}catch(e){writeFailed(e);}
      sync.gone.delete(id);
    }
    if(sync.linksDirty){
      const now=JSON.stringify({meta:S.meta,arrows:S.arrows});
      try{if(now!==sync.links){await sync.db.doc('board/links').set(JSON.parse(now));sync.links=now;}}catch(e){writeFailed(e);}
      sync.linksDirty=false;
    }
  }).catch(()=>{});
  return sync.queue;
}
function writeFailed(e){
  const code=e&&e.code;
  if(code==='invalid_argument'||code==='not_granted'||code==='revoked'){
    sync.readOnly=true; setSyncLabel('Lecture seule',false);
    if(!sync.warned){sync.warned=true;toast('Tu peux regarder la partie, pas la modifier : demande à l’organisateur de te passer Contributeur.');}
    revertToRemote();
  }else if(code==='quota_exceeded'){toast('Le plateau partagé est plein : supprimez quelques pièces.');}
  else setSyncLabel('Connexion instable',false);
}
let remoteCache={pieces:new Map(),links:null};
function revertToRemote(){
  if(!sync.db||!sync.ready) {renderAll();return;}
  applyRemote(true);
}
/* Applique l'état de la base, sauf ce que ce poste est en train d'écrire ou de tenir en main */
function applyRemote(force){
  const held=new Set([...(drag&&drag.kind==='piece'?drag.G:[]),...remoteDrag.keys()]);
  const rp=remoteCache.pieces; let changed=false;
  const list=[];
  for(const p of S.pieces){
    if(rp.has(p.id)){
      if((!force||remoteDrag.has(p.id))&&(held.has(p.id)||sync.dirty.has(p.id))){list.push(p);continue;}
      const n=rp.get(p.id); if(JSON.stringify(pieceData(p))!==JSON.stringify(pieceData(n)))changed=true; list.push(n);
    }else if(!force&&(sync.dirty.has(p.id)||held.has(p.id))) list.push(p);
    else changed=true;
  }
  for(const [id,n] of rp) if(!list.find(p=>p.id===id)&&(force||!sync.gone.has(id))){list.push(n);changed=true;}
  S.pieces=list;
  if(remoteCache.links&&(force||!sync.linksDirty)){
    const L=remoteCache.links, lj=JSON.stringify({meta:L.meta||{},arrows:L.arrows||[]});
    if(lj!==JSON.stringify({meta:S.meta,arrows:S.arrows})){S.meta=clone(L.meta||{});S.arrows=clone(L.arrows||[]).filter(a=>KW[a.kw]);changed=true;}
  }

  if(sel&&sel.type==='piece'&&!byId(sel.id)) sel=null;
  renderAll();
  return changed;
}
async function initCollab(){
  const online=window.PUZZLE_ONLINE&&window.supabase?makeOnline(window.PUZZLE_ONLINE):null;
  const use=n=>{
    if(online) return Promise.resolve(online[n]||null);
    try{return (window.claude&&window.claude.use)?window.claude.use(n):Promise.resolve(null);}catch(_){return Promise.resolve(null);}
  };
  use('room').then(room=>{
    if(!room) return; sync.room=room;
    room.onPeers(ch=>{peers=ch.peers;onPeersChanged();},()=>{});
    if(me) sendPresence({name:me.name,color:me.color});
  }).catch(()=>{});
  const db=await use('db').catch(()=>null);
  if(!db) return;
  sync.db=db; setSyncLabel('Connexion au plateau partagé…',true);
  let gotPieces=false, gotLinks=false, first=true;
  const timer=setTimeout(()=>{if(!sync.ready)setSyncLabel('Plateau partagé injoignable pour l’instant',false);},10000);
  const tryReady=()=>{
    if(!gotPieces||!gotLinks) return;
    if(first){
      first=false; sync.ready=true; clearTimeout(timer); setSyncLabel('Plateau partagé',true);
      if(remoteCache.pieces.size){applyRemote(true);if(!userView)fitView();}
      else{ sync.remote={}; sync.links=null; if(window.PUZZLE_ONLINE){S={pieces:clone(BASE),meta:{},arrows:[]};shuffleLayout(S.pieces,seeded(BOARD));sel=null;commit(false);fitView();} }
      return;
    }
    applyRemote(false);
  };
  db.collection('pieces').onSnapshot(snap=>{
    const m=new Map(); snap.docs.forEach(d=>{if(d.exists)m.set(d.id,cleanPiece(d.id,d.data()));});
    remoteCache.pieces=m;
    if(!snap.metadata.hasPendingWrites){const r={};m.forEach((p,id)=>{r[id]=JSON.stringify(pieceData(p));});
      Object.keys(sync.remote).forEach(id=>{if(!r[id]&&!sync.dirty.has(id))delete sync.remote[id];});
      Object.assign(sync.remote,Object.fromEntries(Object.entries(r).filter(([id])=>!sync.dirty.has(id))));}
    if(!snap.metadata.fromCache) gotPieces=true;
    tryReady();
  },()=>setSyncLabel('Plateau partagé coupé : rechargez la page',false));
  db.doc('board/links').onSnapshot(d=>{
    const v=d.exists?d.data():{meta:{},arrows:[]};
    remoteCache.links=cleanLinks(v);
    if(!d.metadata.hasPendingWrites&&!sync.linksDirty) sync.links=JSON.stringify(remoteCache.links);
    if(!d.metadata.fromCache) gotLinks=true;
    tryReady();
  },()=>{});
}

/* Ce qui vient de la base est écrit par d'autres : on ne garde que des valeurs bien formées */
function cleanLinks(v){
  const meta={}, idOk=x=>typeof x==='string'&&/^[A-Za-z0-9_.~:@+-]{1,80}$/.test(x);
  if(v&&v.meta&&typeof v.meta==='object') for(const [k,m] of Object.entries(v.meta)){
    const [a,b]=k.split('|'); if(!idOk(a)||!idOk(b)||!m||typeof m!=='object') continue;
    const o={}; if(m.type==='EXIGE'||m.type==='PERMET') o.type=m.type;
    if(idOk(m.joint)&&(m.joint===a||m.joint===b)){o.joint=m.joint;if(isFinite(m.ju))o.ju=+m.ju;}
    if(isFinite(m.t)) o.t=clamp(+m.t,0,1);
    meta[k]=o;
  }
  const okRoute=r=>Array.isArray(r)&&r.length&&r.length<=12&&r.every(p=>Array.isArray(p)&&p.length===2&&isFinite(p[0])&&isFinite(p[1]));
  const arrows=(Array.isArray(v&&v.arrows)?v.arrows:[]).filter(a=>a&&idOk(a.id)&&idOk(a.from)&&idOk(a.to)&&KW[a.kw]).slice(0,200).map(a=>{const o={id:a.id,from:a.from,to:a.to,kw:a.kw,flip:!!a.flip};const okA=x=>Array.isArray(x)&&x.length===2&&[0,1,2,3].includes(x[0])&&isFinite(x[1]);
    if(okRoute(a.route)&&okA(a.as)&&okA(a.ae)){o.route=a.route.map(([u,v])=>[clamp(+u,-3,3),clamp(+v,-3,3)]);o.as=[a.as[0],clamp(+a.as[1],0,1)];o.ae=[a.ae[0],clamp(+a.ae[1],0,1)];}return o;});
  return {meta,arrows};
}
/* ---------- En ligne : Supabase joue le rôle de la base partagée et de la salle ---------- */
const BOARD=(()=>{try{const b=new URLSearchParams(location.search).get('b');return b&&/^[a-z0-9-]{1,40}$/.test(b)?b:'cours';}catch(_){return 'cours';}})();
function makeOnline(cfg){
  const sb=window.supabase.createClient(cfg.url,cfg.key,{realtime:{params:{eventsPerSecond:20}}});
  const T='puzzle_items';
  const rows=new Map(); const lis={piece:new Set(),links:new Set()}; let loaded=false, loading=null;
  const snapPieces=()=>{const docs=[...rows.values()].filter(r=>r.kind==='piece').map(r=>({id:r.id,exists:true,data:()=>r.data}));return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]};};
  const snapLinks=()=>{const r=rows.get('links');return {id:'links',exists:!!r,data:()=>r&&r.data,metadata:{fromCache:false,hasPendingWrites:false}};};
  let emitT=0;
  const emit=()=>{if(!loaded||emitT)return;emitT=setTimeout(()=>{emitT=0;lis.piece.forEach(f=>f(snapPieces()));lis.links.forEach(f=>f(snapLinks()));},40);};
  const load=()=>loading||(loading=(async()=>{
    sb.channel('db:'+BOARD).on('postgres_changes',{event:'*',schema:'public',table:T},pl=>{
      const r=pl.eventType==='DELETE'?pl.old:pl.new; if(!r||r.board!==BOARD)return;
      if(pl.eventType==='DELETE')rows.delete(r.id);else rows.set(r.id,r); emit();
    }).subscribe();
    const {data,error}=await sb.from(T).select('id,kind,data,board').eq('board',BOARD);
    if(error) throw error;
    data.forEach(r=>rows.set(r.id,r)); loaded=true; emit();
  })());
  const fail=e=>{const m=String(e&&(e.message||e.code)||'');return {code:/permission|denied|policy|42501/i.test(m)?'not_granted':'unavailable',message:m};};
  const docRef=path=>{
    const [col,id]=path.split('/'); const kind=col==='board'?'links':'piece';
    return {
      async set(data){const {error}=await sb.from(T).upsert({board:BOARD,kind,id,data,updated_at:new Date().toISOString()});if(error)throw fail(error);rows.set(id,{board:BOARD,kind,id,data});},
      async delete(){const {error}=await sb.from(T).delete().eq('board',BOARD).eq('id',id);if(error)throw fail(error);rows.delete(id);},
      onSnapshot(next,err){lis.links.add(next);load().then(()=>next(snapLinks()),e=>err&&err(fail(e)));return ()=>lis.links.delete(next);}
    };
  };
  /* un seul aller-retour pour toutes les cartes changées d'un coup */
  async function batch(sets,dels){
    const now=new Date().toISOString();
    if(sets.length){
      const body=sets.map(([col,id,data])=>({board:BOARD,kind:col==='board'?'links':'piece',id,data,updated_at:now}));
      const {error}=await sb.from(T).upsert(body); if(error) throw fail(error);
      body.forEach(r=>rows.set(r.id,r));
    }
    if(dels.length){const {error}=await sb.from(T).delete().eq('board',BOARD).in('id',dels);if(error)throw fail(error);dels.forEach(id=>rows.delete(id));}
  }
  const db={batch,doc:docRef,collection:()=>({onSnapshot(next,err){lis.piece.add(next);load().then(()=>next(snapPieces()),e=>err&&err(fail(e)));return ()=>lis.piece.delete(next);}})};

  /* Salle : qui est là (presence) et où est chacun (broadcast, dix fois par seconde au plus) */
  const myPeer=Math.random().toString(36).slice(2,12);
  const ch=sb.channel('room:'+BOARD,{config:{presence:{key:myPeer},broadcast:{self:false}}});
  let mine={}, sendT=0, lastSent=0, joined=false; const state=new Map(); const peerFns=new Set();
  const list=()=>{
    const ps=ch.presenceState(); const out=[];
    for(const k of Object.keys(ps)){
      const base=(ps[k]&&ps[k][0])||{}; const live=state.get(k)||{};
      out.push({peer:k,sameTab:k===myPeer,isMe:k===myPeer,kind:'viewer',guest:false,by:null,presence:k===myPeer?mine:{...base,...live.p},updatedAt:live.t||Date.now()});
    }
    if(!ps[myPeer]) out.push({peer:myPeer,sameTab:true,isMe:true,kind:'viewer',guest:false,by:null,presence:mine,updatedAt:Date.now()});
    return out;
  };
  const notify=()=>{const peers=list();peerFns.forEach(f=>f({peers,joined:[],left:[],updated:[]}));};
  const flush=()=>{sendT=0;lastSent=Date.now();if(joined)ch.send({type:'broadcast',event:'p',payload:mine});};
  ch.on('broadcast',{event:'p'},msg=>{const pl=msg.payload||{};const k=pl.__k;if(!k||k===myPeer)return;const o={...pl};delete o.__k;state.set(k,{p:o,t:Date.now()});notify();});
  ch.on('presence',{event:'sync'},notify);
  ch.on('presence',{event:'join'},({key})=>{if(key!==myPeer&&joined)setTimeout(()=>{mine.__k=myPeer;flush();},300);});
  ch.on('presence',{event:'leave'},({key})=>{state.delete(key);notify();});
  ch.subscribe(async st=>{if(st==='SUBSCRIBED'){joined=true;await ch.track({name:mine.name||'',color:mine.color||''});mine.__k=myPeer;flush();notify();}});
  const room={
    presence(patch){
      for(const [k,v] of Object.entries(patch)){if(v===null)delete mine[k];else mine[k]=v;}
      mine.__k=myPeer;
      if('name' in patch||'color' in patch){if(joined)ch.track({name:mine.name||'',color:mine.color||''});}
      if(!sendT){const wait=Math.max(0,60-(Date.now()-lastSent));sendT=setTimeout(flush,wait);}
      return Promise.resolve();
    },
    onPeers(fn){peerFns.add(fn);setTimeout(notify,0);return ()=>peerFns.delete(fn);},
  };
  return {db,room};
}

/* ---------- Présence : curseurs et profils ---------- */
function sendPresence(patch){if(sync.room)sync.room.presence(patch).catch(()=>{});}
const releaseT=new Map();
let peersRaf=0;
function onPeersChanged(){
  if(peersRaf) return; peersRaf=1;
  const run=()=>{if(!peersRaf)return;peersRaf=0;applyPeers();};
  requestAnimationFrame(run); setTimeout(run,70);
}
function applyPeers(){
  const rd=new Map();
  for(const pr of peers){
    if(pr.sameTab) continue; const d=pr.presence&&pr.presence.drag;
    if(Array.isArray(d)) d.slice(0,24).forEach(it=>{if(Array.isArray(it)&&typeof it[0]==='string'&&isFinite(it[1])&&isFinite(it[2])&&!(drag&&drag.G&&drag.G.has(it[0])))rd.set(it[0],[+it[1],+it[2]]);});
  }
  let moved=false;
  for(const [id,[x,y]] of rd){const p=byId(id);clearTimeout(releaseT.get(id));if(p&&(p.x!==x||p.y!==y)){p.x=x;p.y=y;moved=true;}}
  /* lâchée chez l'autre : on attend la position enregistrée, puis on se recale sur elle */
  for(const id of remoteDrag.keys()) if(!rd.has(id)){
    const last=remoteDrag.get(id);
    clearTimeout(releaseT.get(id));
    releaseT.set(id,setTimeout(()=>{releaseT.delete(id);const p=byId(id),t=remoteCache.pieces.get(id);
      if(p&&t&&!sync.dirty.has(id)&&p.x===last[0]&&p.y===last[1]&&(t.x!==p.x||t.y!==p.y)){Object.assign(p,{x:t.x,y:t.y,w:t.w,h:t.h});renderAll();}},1500));
  }
  remoteDrag=rd;
  if(moved){const c=computeContacts(S.pieces);renderPieces(c);renderOverlay(c);updateProgress();}
  else renderOverlay();
  renderCursors(); renderPeople();
}
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'?';
function peerName(pr){const n=pr.presence&&pr.presence.name;return typeof n==='string'&&n.trim()?n.trim().slice(0,24):(pr.guest?'Invité':'Quelqu’un');}
function peerColor(pr){const c=pr.presence&&pr.presence.color;return validColor(c)?c:'#111111';}
const curEls=new Map();
function renderCursors(){
  const L=$('cursors'); if(!L) return;
  const now=Date.now(), seen=new Set();
  for(const pr of peers){
    if(pr.sameTab||pr.kind!=='viewer') continue;
    const ps=pr.presence||{}; if(!isFinite(ps.x)||!isFinite(ps.y)||ps.x===null) continue;
    seen.add(pr.peer);
    const sp=toScreen(+ps.x,+ps.y), col=peerColor(pr), name=peerName(pr);
    let el=curEls.get(pr.peer);
    if(!el){el=document.createElement('div');el.className='cur';el.innerHTML='<svg width="22" height="22" viewBox="0 0 22 22"><path d="M4.2 3.1 L19.4 9.4 L12.3 11.9 L9.6 18.9 Z" stroke-width="3" stroke-linejoin="round"/></svg><span class="tag"></span>';L.appendChild(el);curEls.set(pr.peer,el);}
    if(el._col!==col){el._col=col;const pa=el.querySelector('path');pa.setAttribute('fill',col);pa.setAttribute('stroke',col);const t=el.querySelector('.tag');t.style.background=col;t.style.color=fgOf(col);}
    if(el._name!==name){el._name=name;el.querySelector('.tag').textContent=name;}
    el.style.transform=`translate(${sp.x.toFixed(1)}px,${sp.y.toFixed(1)}px)`;
    el.classList.toggle('idle',now-pr.updatedAt>45000);
  }
  for(const [k,el] of curEls) if(!seen.has(k)){el.remove();curEls.delete(k);}
}
/* pendant un zoom ou un déplacement de vue, les curseurs suivent sans glisser */
function snapCursors(){curEls.forEach(el=>{el.style.transition='none';});renderCursors();requestAnimationFrame(()=>curEls.forEach(el=>{el.style.transition='';}));}
function renderPeople(){
  const box=$('people'); if(!box) return;
  const others=peers.filter(p=>!p.sameTab&&p.kind==='viewer');
  if(!sync.room&&!me){box.innerHTML='';return;}
  let html='';
  if(me) html+=`<button class="av me" data-me="1" style="background:${me.color};color:${fgOf(me.color)}" title="${esc(me.name)} (toi) : changer de prénom ou de couleur">${esc(initials(me.name))}</button>`;
  others.slice(0,6).forEach(pr=>{const c=peerColor(pr);html+=`<button class="av" data-peer="${esc(pr.peer)}" style="background:${c};color:${fgOf(c)}" title="${esc(peerName(pr))} : aller à son curseur">${esc(initials(peerName(pr)))}</button>`;});
  if(others.length>6) html+=`<span class="more">+${others.length-6}</span>`;
  if(box._html!==html){box._html=html;box.innerHTML=html;}
}
$('people').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.me){openIntro();return;}
  const pr=peers.find(p=>p.peer===b.dataset.peer), ps=pr&&pr.presence;
  if(ps&&isFinite(ps.x)&&isFinite(ps.y)&&ps.x!==null){userView=true;const sp=toScreen(+ps.x,+ps.y);view.tx+=innerWidth/2-sp.x;view.ty+=innerHeight/2-sp.y;applyView();}
  else toast(`${peerName(pr||{})} n’a pas encore bougé sa souris sur le plateau.`);
});

/* ---------- Démarrage ---------- */
function start(data){
  let d=data&&data.S;
  if(!d){try{const raw=localStorage.getItem(STORE);if(raw)d=JSON.parse(raw);}catch(_){d=null;}}
  if(d&&Array.isArray(d.pieces)&&d.pieces.length) S=normalize(d); else newGame();
  renderAll();
  if(data&&data.view){view=data.view;applyView();}else fitView();
  if(!me) openIntro();
  initCollab();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({S:JSON.parse(snapshot()),view}));}catch(_){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(start);
else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
window.__puzzle={S:()=>S,verify,computeContacts,BASE,doSolution,findSnap,byId,commit,resizableIn};
})();
</script>
