<style>
/* Layout : plateau infini blanc du design, cartes au pixel près, outils en bas, légende des liaisons à gauche */
:root{
  --paper:#FFFFFF; --ink:#111111; --wine:#9F0049; --orange:#FC5912; --sky:#C5ECFF; --violet:#8E8EF7;
  --mist:#F3F3F0; --shade:rgba(17,17,17,.14);
  --j-permet:#6E6915; --j-exige:#9F0049; --permet:#EE7AE8; --exige:#C5FAEA; --oppose:#F08F36;
  --f:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none;touch-action:manipulation}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
#vp{position:fixed;inset:0;overflow:hidden;touch-action:none;background:var(--paper)}
#vp.panning{cursor:grabbing}
#vp.space,#vp.space .piece .sh path{cursor:grab}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.layer{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}

/* Cartes */
.piece{position:absolute;left:0;top:0;pointer-events:none}
.piece .sh{position:absolute;overflow:visible;pointer-events:none}
.piece .sh path{pointer-events:visiblePainted;cursor:grab}
.tool-link .piece .sh path{cursor:crosshair}
.tool-link #vp,.tool-link{cursor:crosshair}
.tool-link #Larrows *{pointer-events:none!important}
.piece.lift{filter:drop-shadow(0 30px 34px rgba(17,17,17,.24))}
.piece.lift .sh path{cursor:grabbing}
.piece.aimant{filter:drop-shadow(0 14px 26px rgba(17,17,17,.22))}
.piece.snapping{transition:transform .16s cubic-bezier(.2,.9,.3,1.25)}
.c{position:absolute;inset:0;--k:1;padding:var(--pt,76px) var(--pr,64px) 0 var(--pl,64px);color:var(--fg);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;box-sizing:border-box}
.num{font-weight:700;font-size:calc(58px*var(--k));line-height:1;letter-spacing:-.01em;margin-bottom:calc(38px*var(--k))}
.ttl{font-weight:500;font-size:calc(46px*var(--k));line-height:1.08;text-transform:uppercase;margin-bottom:calc(22px*var(--k));overflow-wrap:break-word}
.dsc{font-size:calc(23px*var(--k));line-height:1.3;white-space:pre-line;overflow-wrap:break-word}
.dsc b{font-weight:700}
.rule{height:1.5px;background:var(--fg);opacity:.5;margin-top:calc(32px*var(--k));flex:none}
.src{font-size:calc(18px*var(--k));opacity:.68;margin-top:calc(9px*var(--k));overflow-wrap:break-word}

/* Jonctions */
.badge{position:absolute;left:0;top:0;width:161px;height:161px;margin:-80.5px 0 0 -80.5px;border-radius:50%;display:grid;place-items:center;font-weight:500;pointer-events:auto;cursor:pointer;user-select:none;-webkit-user-select:none;line-height:1}
.badge.exige,.badge.permet{background:#fff;font-size:34px;letter-spacing:-.005em}
.badge.exige{color:var(--j-exige)}
.badge.permet{color:var(--j-permet)}
.badge.vide{width:124px;height:124px;margin:-62px 0 0 -62px;background:#fff;font-size:0;box-shadow:0 10px 26px rgba(17,17,17,.2);transition:scale .15s ease,box-shadow .15s ease;animation:vide-in .22s cubic-bezier(.2,.9,.3,1.3)}
.badge.vide::before,.badge.vide::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:5px;margin:-2.5px 0 0 -22px;background:var(--ink);border-radius:3px}
.badge.vide::after{rotate:90deg}
.badge.vide:hover{scale:1.08;box-shadow:0 14px 32px rgba(17,17,17,.26)}
@keyframes vide-in{from{scale:.4;opacity:0}to{scale:1;opacity:1}}

/* Interface */
.panel{position:fixed;background:#fff;box-shadow:0 10px 34px var(--shade);z-index:20}
#head{top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:14px 18px;display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 32px)}
#head h1{margin:0;font-size:20px;font-weight:500;letter-spacing:.02em;text-transform:uppercase}
#head .sub{font-size:13px;opacity:.65}
#prog{font-variant-numeric:tabular-nums;font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center;margin-top:4px}
#prog .dot{width:10px;height:10px;border-radius:50%;background:var(--wine)}
#topr{top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;padding:6px;gap:2px}
#bar{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.grp{display:flex;gap:2px;align-items:center;flex:none}
.sep{width:1px;align-self:stretch;background:var(--ink);opacity:.12;flex:none;margin:6px 4px}
.btn{border:0;background:transparent;padding:10px 14px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;flex:none}
.btn:hover{background:var(--mist)}
.btn.on{background:var(--ink);color:#fff}
.btn.wine{background:var(--wine);color:#fff}
.btn.wine:hover{background:#86003D}
.btn:disabled{opacity:.3;cursor:default;background:transparent}
.btn:focus-visible,.round:focus-visible,.chip:focus-visible,.sw:focus-visible,.fmt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.round{width:38px;height:38px;border-radius:50%;border:0;background:var(--mist);cursor:pointer;font-size:20px;line-height:1;flex:none;display:grid;place-items:center}
.round:hover{background:#E7E7E2}
#zval{font-size:13px;font-variant-numeric:tabular-nums;width:46px;text-align:center;flex:none}
#legend{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:16px 18px;display:flex;flex-direction:column;gap:10px;font-size:14px}
#legend .lt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
#legend .lg{display:flex;align-items:center;gap:12px;font-weight:700}
#legend .lg i{width:26px;height:22px;display:block;flex:none}
#legend .lg .mini{width:30px;height:30px;border-radius:50%;flex:none;background:#fff;box-shadow:0 2px 8px rgba(17,17,17,.2);display:grid;place-items:center;font-size:8px;font-weight:500}
#selbar{top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
#selbar .what{font-size:13px;padding:0 10px 0 8px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;flex:none}
#selbar .what b{font-weight:500;text-transform:uppercase}
.chip{border:0;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 12px;background:transparent;font-size:14px;font-weight:700;white-space:nowrap;flex:none}
.chip i{width:16px;height:14px;display:block}
.chip.on{background:var(--mist);box-shadow:inset 0 -3px 0 var(--ink)}
.chip:hover{background:var(--mist)}
.ic{display:none;font-size:18px;line-height:1}
.btn.hist{padding:8px 10px;display:grid;place-items:center}

#pop{position:fixed;z-index:30;padding:10px;display:flex;gap:8px;align-items:center}
#pop .pb{width:76px;height:76px;border-radius:50%;border:0;cursor:pointer;font-weight:500;display:grid;place-items:center;flex:none}
#pop .pb.exige,#pop .pb.permet{background:#fff;font-size:15px;box-shadow:0 3px 12px rgba(17,17,17,.18)}
#pop .pb.exige{color:var(--j-exige)}
#pop .pb.permet{color:var(--j-permet)}
#pop .pb.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)!important}
#pop .lbl{font-size:12px;opacity:.6;max-width:90px;line-height:1.25;padding:0 4px}

#handles{position:absolute;inset:0;pointer-events:none;z-index:3}
.hd{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:0;padding:0;background:#fff;box-shadow:0 1px 6px rgba(17,17,17,.35);pointer-events:auto;cursor:crosshair;transition:scale .12s ease;animation:hd-in .16s ease}
.hd::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--ink)}
.hd:hover{scale:1.3}
@keyframes hd-in{from{opacity:0;scale:.5}to{opacity:1;scale:1}}
#pop .chip{border-radius:0}
.ctx{position:fixed;z-index:45;background:#fff;box-shadow:0 12px 36px rgba(17,17,17,.22);padding:6px;min-width:230px;max-width:calc(100% - 24px);font-size:14px;user-select:none;-webkit-user-select:none}
.ctx .it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;text-align:left;cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}
.ctx .it:hover,.ctx .it:focus-visible{background:var(--mist);outline:none}
.ctx .it .k{margin-left:auto;font-size:12px;opacity:.5;font-variant-numeric:tabular-nums;padding-left:18px}
.ctx .it i{width:14px;height:14px;display:block;flex:none}
.ctx .it .dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 1px 4px rgba(17,17,17,.25);background:#fff}
.ctx .it.on{font-weight:700}
.ctx .it.danger{color:var(--wine)}
.ctx .hd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.5;padding:8px 10px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx .sp{height:1px;background:var(--ink);opacity:.1;margin:5px 4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 16px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:40;max-width:calc(100% - 32px)}
#toast button{background:transparent;border:0;color:#fff;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;flex:none}

/* Fenêtres */
.modal{position:fixed;inset:0;z-index:50;background:rgba(17,17,17,.32);display:grid;place-items:center;padding:16px}
.sheet{background:#fff;max-width:1040px;width:100%;max-height:calc(100% - 32px);overflow:auto;box-shadow:0 30px 80px rgba(17,17,17,.3)}
.data{padding:28px;display:flex;flex-direction:column;gap:14px}
.data h2,.ed-side h2{margin:0;font-size:20px;font-weight:500;text-transform:uppercase;letter-spacing:.02em}
.data textarea{font:inherit;border:0;background:var(--mist);padding:10px 12px;color:var(--ink);border-radius:0;resize:vertical;min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.data textarea:focus{outline:2px solid var(--ink);outline-offset:0}
.hint{font-size:13px;opacity:.62;line-height:1.4}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* Fenêtre de création : on écrit directement sur la carte */
.ed{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr)}
.ed-stage{background:var(--mist);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:36px 28px;min-height:520px;min-width:0}
.ed-card{position:relative;flex:none}
.ed-card .piece{pointer-events:auto}
.ed-card .c{user-select:text;-webkit-user-select:text}
.ed-card [contenteditable]{outline:none;cursor:text;min-height:1em;border-radius:2px;transition:box-shadow .12s}
.ed-card [contenteditable]:hover{box-shadow:0 0 0 6px color-mix(in srgb,var(--fg) 14%,transparent)}
.ed-card [contenteditable]:focus{box-shadow:0 0 0 6px color-mix(in srgb,var(--fg) 26%,transparent)}
.ed-card [contenteditable]:empty::before{content:attr(data-ph);opacity:.42}
.ed-card .num[contenteditable]{align-self:flex-start;min-width:1.3em}
.ed-stage .hint{text-align:center;max-width:380px}
.ed-side{padding:28px;display:flex;flex-direction:column;gap:22px;min-width:0}
.blk{display:flex;flex-direction:column;gap:10px}
.blk .lab{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.fams{display:flex;flex-direction:column;gap:6px}
.fam{display:flex;align-items:center;gap:6px}
.fam i{width:22px;height:8px;display:block;flex:none;margin-right:4px}
.sw{width:34px;height:40px;border:0;cursor:pointer;flex:none;padding:0}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.fmts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fmt{border:0;background:var(--mist);cursor:pointer;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500}
.fmt span.box{display:block;background:var(--ink);opacity:.22}
.fmt.on{background:var(--ink);color:#fff}
.fmt.on span.box{background:#fff;opacity:.9}
.ed-side .acts{margin-top:auto}

/* Règles du jeu */
.intro{background:var(--wine);color:#fff;max-width:600px;width:100%;max-height:calc(100% - 32px);overflow:auto;box-sizing:border-box;position:relative;padding:76px 64px 56px;box-shadow:0 30px 80px rgba(17,17,17,.35)}
.intro .num{font-size:44px;margin-bottom:26px}
.intro .ttl{font-size:34px;margin-bottom:22px}
.intro ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.4}
.intro .rule{opacity:.5;margin:28px 0 18px;background:#fff}
.intro .btn{background:#fff;color:var(--wine);padding:12px 20px;font-size:15px}
.intro .btn:hover{background:#FFE5F9}

.cursors{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.cur{position:absolute;left:0;top:0;transition:transform .12s linear,opacity .3s;will-change:transform}
.piece.remote{transition:transform .12s linear}
.cur svg{display:block;overflow:visible;filter:drop-shadow(0 1px 1.5px rgba(17,17,17,.28))}
.cur .tag{position:absolute;left:22px;top:27px;padding:3px 8px 4px;border-radius:6px;font-size:13px;font-weight:500;line-height:1.25;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 3px rgba(17,17,17,.18)}
.cur.idle{opacity:.45}
#people{display:flex;align-items:center;padding:0 6px 0 2px}
#people .av{width:32px;height:32px;border-radius:50%;border:0;display:grid;place-items:center;font-size:12px;font-weight:700;margin-left:-6px;box-shadow:0 0 0 2.5px #fff;cursor:pointer;flex:none;padding:0}
#people .av:first-child{margin-left:0}
#people .av.me{box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px var(--ink)}
#people .more{font-size:12px;font-weight:500;margin-left:6px;opacity:.7}
#people:empty{display:none}
.join{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.join label{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.join input{font:inherit;font-size:18px;border:0;background:rgba(255,255,255,.14);color:#fff;padding:12px 14px;border-radius:0}
.join input::placeholder{color:rgba(255,255,255,.55)}
.join input:focus{outline:2px solid #fff;outline-offset:0}
.join .cols{display:flex;gap:8px;flex-wrap:wrap}
.join .pc{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;padding:0;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.join .pc.on{box-shadow:0 0 0 3px var(--wine),0 0 0 5px #fff}
.intro .err{font-size:13px;color:#FFD9C9;min-height:1em}
#sync{font-size:12px;opacity:.6;display:flex;gap:6px;align-items:center}
#sync i{width:7px;height:7px;border-radius:50%;background:#9E960A;display:block}
#sync.off i{background:#FE8D5D}
@media (max-width:760px){
  #people .av:nth-child(n+4){display:none}
  .tl{display:none}.ic{display:inline}
  #topr .btn{padding:8px 10px}
  #head{max-width:calc(100% - 230px);padding:10px 12px}
  #head h1{font-size:15px}
  #head .sub{display:none}
  #legend{display:none}
  .ed{grid-template-columns:minmax(0,1fr)}
  .ed-stage{min-height:0;padding:24px 16px}
  .ed-side{padding:20px}
  .intro{padding:64px 28px 40px}
  .intro .ttl{font-size:26px}
  #selbar{top:calc(110px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){.piece.snapping{transition:none}.hd{animation:none;transition:none}.badge.vide{animation:none;transition:none}}
</style>

<div id="vp">
  <div class="world" id="world">
    <svg class="layer" id="Larrows" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg>
    <div class="layer" id="Lpieces"></div>
    <svg class="layer" id="Lghost" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="layer" id="Lbadges"></div>
  </div>
  <div id="handles"></div>
</div>

<header class="panel" id="head">
  <h1>Le puzzle du manager</h1>
  <div class="sub">Reconstituez la carte : emboîtez, qualifiez, reliez.</div>
  <div id="prog"><span class="dot"></span><span id="progTxt">0 / 15 assemblages</span></div>
  <div id="sync" hidden><i></i><span id="syncTxt">Plateau partagé</span></div>
</header>

<div class="cursors" id="cursors"></div>
<div class="panel" id="topr">
  <div id="people" aria-label="Personnes sur le plateau"></div>
  <button class="btn hist" id="bUndo" title="Annuler (⌘Z)" aria-label="Annuler"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="btn hist" id="bRedo" title="Rétablir (⌘⇧Z)" aria-label="Rétablir"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <span class="sep"></span>
  <button class="btn wine" id="bShare" hidden>Partager</button>
  <button class="btn" id="bData" aria-label="Sauvegarde"><span class="tl">Sauvegarde</span><span class="ic">⇅</span></button>
  <button class="round" id="bHelp" title="Règles du jeu" aria-label="Règles du jeu">?</button>
</div>

<div class="panel" id="selbar" hidden></div>

<aside class="panel" id="legend">
  <div class="lt">Flèches entre groupes</div>
  <div class="lg"><i style="background:var(--permet)"></i>permet</div>
  <div class="lg"><i style="background:var(--exige)"></i>exige</div>
  <div class="lg"><i style="background:var(--oppose)"></i>s’oppose à</div>
  <div class="lt" style="margin-top:6px">Jonctions entre pièces</div>
  <div class="lg"><span class="mini" style="color:var(--j-exige)">EXIGE</span>exige</div>
  <div class="lg"><span class="mini" style="color:var(--j-permet)">PERMET</span>permet</div>
</aside>

<nav class="panel" id="bar">
  <div class="grp">
    <button class="btn on" id="tMove" title="Déplacer (V)"><svg width="14" height="15" viewBox="0 0 22 22" style="vertical-align:-2px;margin-right:6px" aria-hidden="true"><path d="M4.2 3.1 L19.4 9.4 L12.3 11.9 L9.6 18.9 Z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>Déplacer</button>
    <button class="btn" id="tLink" title="Plume : trace une flèche d’une carte à l’autre (P)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px" aria-hidden="true"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>Plume</button>
  </div>
  <span class="sep"></span>
  <button class="btn wine" id="bAdd">+ Pièce</button>
  <span class="sep"></span>
  <div class="grp">
    <button class="btn" id="bShuffle">Mélanger</button>
    <button class="btn" id="bSolution">Solution</button>
    <button class="btn" id="bVerify">Vérifier</button>
  </div>
  <span class="sep"></span>
  <div class="grp">

].map(([from,to,kw],i)=>({id:'s'+i,from,to,kw,flip:false}));

/* ---------- État ---------- */
let S={pieces:[],meta:{},arrows:[]};
let view={tx:0,ty:0,s:.2};
let sel=null, tool='move', drag=null, pinch=null, spaceDown=false, editor=null, userView=false;
let hint=null;   // aperçu d'emboîtement pendant un glisser
/* Collaboration : la salle (curseurs, présence) et la base partagée (le plateau commun) */
const PLAYER_COLORS=['#9F0049','#FB75DE','#9E960A','#81CFF4','#FC5912','#880B6D','#0E4E6D','#CCC20E','#792D0D','#FE8D5D'];

const sync={db:null,room:null,remote:{},links:null,ready:false,readOnly:false,queue:Promise.resolve(),dirty:new Set(),gone:new Set(),linksDirty:false,warned:false};
let peers=[], remoteDrag=new Map();
const touches=new Map(), hist=[], redoStack=[], els=new Map();
const byId=id=>S.pieces.find(p=>p.id===id);
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- Géométrie des contacts ---------- */
function edgeContact(A,B){
  if(overlap(A,B)) return null;
  const cfg=[
    [Math.abs(A.x+A.w-B.x)<EPS,'right','left','y',A.x+A.w],
    [Math.abs(B.x+B.w-A.x)<EPS,'left','right','y',A.x],
    [Math.abs(A.y+A.h-B.y)<EPS,'bottom','top','x',A.y+A.h],
    [Math.abs(B.y+B.h-A.y)<EPS,'top','bottom','x',A.y],
  ];
  for(const [hit,sa,sb,axis,line] of cfg){
    if(!hit) continue;
    const a0=axis==='y'?A.y:A.x, a1=a0+(axis==='y'?A.h:A.w);
    const b0=axis==='y'?B.y:B.x, b1=b0+(axis==='y'?B.h:B.w);
    const o0=Math.max(a0,b0), o1=Math.min(a1,b1);
    if(o1-o0<MINOV) continue;
    return {a:A.id,b:B.id,sa,sb,axis,line,o0,o1,key:key(A.id,B.id)};
  }
  return null;
}
function computeContacts(list){
  const out=[];
  for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){const c=edgeContact(list[i],list[j]);if(c)out.push(c);}
  return out;
}
function overlap(A,B,pad=0){
  return Math.min(A.x+A.w,B.x+B.w)-Math.max(A.x,B.x)>2-pad && Math.min(A.y+A.h,B.y+B.h)-Math.max(A.y,B.y)>2-pad;
}
function groupsOf(contacts){
  const par=new Map(); const f=x=>{while(par.has(x)&&par.get(x)!==x)x=par.get(x);return x;};
  S.pieces.forEach(p=>par.set(p.id,p.id));
  contacts.forEach(c=>{const a=f(c.a),b=f(c.b);if(a!==b)par.set(a,b);});
  const g=new Map(); S.pieces.forEach(p=>{const r=f(p.id);if(!g.has(r))g.set(r,new Set());g.get(r).add(p.id);});
  const of=new Map(); g.forEach(set=>set.forEach(id=>of.set(id,set))); return of;
}
const groupOf=(id,contacts=computeContacts(S.pieces))=>groupsOf(contacts).get(id)||new Set([id]);
function jointU(c,m){
  const L=c.o1-c.o0; let ju=m&&m.ju!=null?m.ju:L/2;
  ju=L<2*R+24?L/2:clamp(ju,R+12,L-R-12); return c.o0+ju;
}
function badgePos(c){
  const m=S.meta[c.key]||{};
  const u=m.joint?jointU(c,m):m.t!=null?c.o0+m.t*(c.o1-c.o0):(c.o0+c.o1)/2;
  return c.axis==='y'?{x:c.line,y:u}:{x:u,y:c.line};
}
/* Encoches de chaque carte : elles ne viennent que des emboîtements (et de l'aperçu en cours) */
function featuresMap(contacts,hv){
  const M=new Map(); const get=id=>{if(!M.has(id))M.set(id,{top:[],right:[],bottom:[],left:[],badge:new Set()});return M.get(id);};
  const add=(c,u,owner,r)=>{
    const A=byId(c.a),B=byId(c.b);
    for(const [P,side] of [[A,c.sa],[B,c.sb]]){
      const start=c.axis==='y'?P.y:P.x;
      get(P.id)[side].push({p:u-start,k:P.id===owner?'tab':'hole',r});
    }
  };
  for(const c of contacts){
    const m=S.meta[c.key]; if(!m||!byId(c.a)||!byId(c.b)) continue;
    if(m.joint) add(c,jointU(c,m),m.joint,R);
    /* une pastille sur la jointure : le texte des deux cartes s'en écarte */
    if(m.type==='EXIGE'||m.type==='PERMET'){get(c.a).badge.add(c.sa);get(c.b).badge.add(c.sb);}
  }
  if(hv&&hv.r>0.5){
    const A=byId(hv.a),B=byId(hv.b);
    if(A&&B){
      get(A.id)[hv.sa].push({p:hv.pa,k:'tab',r:hv.r});
      get(B.id)[hv.sb].push({p:hv.pb,k:'hole',r:hv.r});
    }
  }
  return M;
}
const EMPTY={top:[],right:[],bottom:[],left:[]};
function shapePath(p,f=EMPTY){
  const {w,h}=p, sw=q=>q.k==='tab'?1:0, rr=q=>q.r||R;
  let d='M0 0';
  [...f.top].sort((a,b)=>a.p-b.p).forEach(q=>{d+=` L${q.p-rr(q)} 0 A${rr(q)} ${rr(q)} 0 0 ${sw(q)} ${q.p+rr(q)} 0`;});
  d+=` L${w} 0`;
  [...f.right].sort((a,b)=>a.p-b.p).forEach(q=>{d+=` L${w} ${q.p-rr(q)} A${rr(q)} ${rr(q)} 0 0 ${sw(q)} ${w} ${q.p+rr(q)}`;});
  d+=` L${w} ${h}`;
  [...f.bottom].sort((a,b)=>b.p-a.p).forEach(q=>{d+=` L${q.p+rr(q)} ${h} A${rr(q)} ${rr(q)} 0 0 ${sw(q)} ${q.p-rr(q)} ${h}`;});
  d+=` L0 ${h}`;
  [...f.left].sort((a,b)=>b.p-a.p).forEach(q=>{d+=` L0 ${q.p+rr(q)} A${rr(q)} ${rr(q)} 0 0 ${sw(q)} 0 ${q.p-rr(q)}`;});
  return d+' Z';
}

/* ---------- Aimantation : n'importe quelle carte va avec n'importe quelle autre ---------- */
function facingCands(A,B,canResize){
  const out=[];
  for(const perp of [B.x-(A.x+A.w),(B.x+B.w)-A.x]){
    if(Math.abs(perp)>SNAP) continue;
    if(Math.min(A.y+A.h,B.y+B.h)-Math.max(A.y,B.y)<-SNAP) continue;
    if(canResize) out.push({dx:perp,dy:B.y-A.y,h:B.h,pen:0,ax:'h'});
    else{
      out.push({dx:perp,dy:B.y-A.y,h:null,pen:0,ax:'h'});
      out.push({dx:perp,dy:B.y+B.h-A.h-A.y,h:null,pen:4,ax:'h'});
    }
  }
  for(const perp of [B.y-(A.y+A.h),(B.y+B.h)-A.y]){
    if(Math.abs(perp)>SNAP) continue;
    if(Math.min(A.x+A.w,B.x+B.w)-Math.max(A.x,B.x)<-SNAP) continue;
    out.push({dx:B.x-A.x,dy:perp,h:null,pen:0,ax:'v'});
    out.push({dx:B.x+B.w-A.w-A.x,dy:perp,h:null,pen:2,ax:'v'});
  }
  return out;
}
/* Règle des bords : une carte posée seule supprime les petits décrochements avec les cartes au-dessus et au-dessous */
function squareUp(A2,others,cd,B){
  const near=(a,b)=>Math.abs(a-b)<EPS;
  const stacked=others.filter(o=>(near(A2.y+A2.h,o.y)||near(o.y+o.h,A2.y))&&Math.min(A2.x+A2.w,o.x+o.w)-Math.max(A2.x,o.x)>0);
  const leftFixed=cd.ax==='h'&&near(A2.x,B.x+B.w), rightFixed=cd.ax==='h'&&near(A2.x+A2.w,B.x);
  for(const o of stacked){
    const dl=o.x-A2.x, dr=(o.x+o.w)-(A2.x+A2.w);
    const smallL=Math.abs(dl)>EPS&&Math.abs(dl)<STEP, smallR=Math.abs(dr)>EPS&&Math.abs(dr)<STEP;
    if(smallL&&!leftFixed){A2.x+=dl;A2.w-=dl;}
    if(smallR&&!rightFixed){A2.w+=dr;}
  }
  A2.w=Math.max(300,A2.w);
  if(cd.ax!=='v') return;
  /* posée dessous ou dessus : même règle pour le haut et le bas, face aux cartes de côté */
  const topFixed=near(A2.y,B.y+B.h), botFixed=near(A2.y+A2.h,B.y);
  const side=others.filter(o=>(near(A2.x+A2.w,o.x)||near(o.x+o.w,A2.x))&&Math.min(A2.y+A2.h,o.y+o.h)-Math.max(A2.y,o.y)>0);
  for(const o of side){
    const dt=o.y-A2.y, db=(o.y+o.h)-(A2.y+A2.h);
    if(!botFixed&&Math.abs(db)>EPS&&Math.abs(db)<STEP) A2.h+=db;
    if(!topFixed&&Math.abs(dt)>EPS&&Math.abs(dt)<STEP){A2.y+=dt;A2.h-=dt;}
  }
  A2.h=Math.max(300,A2.h);
}
function tryCand(moving,others,cd,A,B){
  const mv=moving.map(m=>{const o={...m,x:m.x+cd.dx,y:m.y+cd.dy};if(m.id===A.id&&cd.h!=null)o.h=cd.h;return o;});
  const A2=mv.find(m=>m.id===A.id);
  if(mv.length===1) squareUp(A2,others,cd,B);
  for(const m of mv){
    for(const o of others) if(overlap(m,o)) return null;
    if(m!==A2&&cd.h!=null&&overlap(m,A2)) return null;
  }
  const c=edgeContact(A2,B); if(!c) return null;
  return {A2,c};
}
function findSnap(G,resizable){
  const moving=S.pieces.filter(p=>G.has(p.id)), others=S.pieces.filter(p=>!G.has(p.id));
  let best=null;
  for(const A of moving) for(const B of others){
    if(A.x>B.x+B.w+SNAP||B.x>A.x+A.w+SNAP||A.y>B.y+B.h+SNAP||B.y>A.y+A.h+SNAP) continue;
    for(const cd of facingCands(A,B,resizable.has(A.id))){
      const perp=Math.abs(cd.ax==='h'?cd.dx:cd.dy), along=Math.abs(cd.ax==='h'?cd.dy:cd.dx);
      if(along>720) continue;
      const score=perp+along*.25+cd.pen+(cd.h!=null?Math.abs(cd.h-A.h)*.05:0);
      if(best&&score>=best.score) continue;
      const r=tryCand(moving,others,cd,A,B);
      if(r) best={...cd,score,a:A.id,b:B.id,c:r.c,A2:r.A2};
    }
  }
  return best;
}

/* ---------- Rendu des cartes ---------- */
function lum(hex){const n=parseInt(hex.slice(1),16),c=[n>>16,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
const fgOf=color=>lum(color)<.2?'#FFFFFF':'#111111';
/* Les marges du texte s'écartent des creux, pour qu'aucune lettre ne soit mangée par une encoche */
function pads(p,f){
  const base=p.w>=600?66:58, clear=R+24, hole=s=>f[s].some(q=>q.k==='hole')||!!(f.badge&&f.badge.has(s));
  return {pt:hole('top')?Math.max(76,clear):76, pr:hole('right')?clear:base, pb:hole('bottom')?clear:34, pl:hole('left')?clear:base};
}
function contentHTML(p,pd,edit){
  const ce=(cls,val,ph,html)=>edit?`<div class="${cls}" contenteditable="plaintext-only" spellcheck="true" data-f="${cls}" data-ph="${ph}">${esc(val)}</div>`:(val?`<div class="${cls}">${html||esc(val)}</div>`:'');
  return `<div class="c" style="--fg:${fgOf(p.color)};--pt:${pd.pt}px;--pr:${pd.pr}px;--pl:${pd.pl}px">`+
    ce('num',p.num,'N°')+
    (edit?ce('ttl',p.title,'Titre'):`<div class="ttl">${esc(p.title||'Sans titre')}</div>`)+
    ce('dsc',p.desc,'Définition de la notion',md(p.desc))+
    (p.src||edit?`<div class="rule"></div>`:'')+ce('src',p.src,'Source')+`</div>`;
}
function pieceInner(p,f,edit){
  const pd=pads(p,f);
  return `<svg class="sh" viewBox="${-R} ${-R} ${p.w+2*R} ${p.h+2*R}" width="${p.w+2*R}" height="${p.h+2*R}" style="left:${-R}px;top:${-R}px"><path ${edit?'':`data-pid="${p.id}"`} d="${shapePath(p,f)}" fill="${p.color}"/></svg>${contentHTML(p,pd,edit)}`;
}
function fitText(el,p,pb){
  const c=el.querySelector('.c'); if(!c) return;
  let k=1; c.style.setProperty('--k','1');
  const need=()=>{const l=c.lastElementChild;return l?l.offsetTop+l.offsetHeight:0;};
  const wide=()=>[...c.children].some(x=>x.scrollWidth>x.clientWidth+1);
  for(let i=0;i<14&&(need()>p.h-pb||wide())&&k>.45;i++){k-=.05;c.style.setProperty('--k',k.toFixed(2));}
}
let orderSig='';
function renderPieces(contacts=computeContacts(S.pieces)){
  const F=featuresMap(contacts,hint);
  const L=$('Lpieces'), alive=new Set();
  const realF=hint?featuresMap(contacts,null):F;
  for(const p of S.pieces){
    alive.add(p.id);
    let el=els.get(p.id);
    if(!el){el=document.createElement('div');el.className='piece';els.set(p.id,el);}
    const f=F.get(p.id)||EMPTY, pd=pads(p,realF.get(p.id)||EMPTY);
    const sig=JSON.stringify([p.num,p.title,p.desc,p.src,p.color,p.w,p.h,pd]);
    if(el._sig!==sig){
      el.style.width=p.w+'px';el.style.height=p.h+'px';el.innerHTML=pieceInner(p,realF.get(p.id)||EMPTY);el._sig=sig;el._fit=true;
      el._path=el.querySelector('path');
    }
    el._path.setAttribute('d',shapePath(p,f));
    el.style.transform=`translate(${p.x}px,${p.y}px)`;
    el.classList.toggle('lift',remoteDrag.has(p.id)||!!(drag&&drag.kind==='piece'&&drag.moved&&drag.G.has(p.id)));
    el.classList.toggle('remote',remoteDrag.has(p.id));
    el.classList.toggle('aimant',!!(hint&&hint.r>1&&(p.id===hint.b)));

  one(b.pieces||[],a.pieces,'pieces'); one(b.arrows||[],a.arrows,'arrows');
  const bm=b.meta||{}; for(const k of new Set([...Object.keys(bm),...Object.keys(a.meta)])){const x=bm[k]||null,y=a.meta[k]||null;if(JSON.stringify(x)!==JSON.stringify(y)){e.meta[k]=[x,y];n++;}}

  Object.entries(e.pieces).forEach(([id,v])=>put(S.pieces,id,v[idx]));
  Object.entries(e.arrows).forEach(([id,v])=>put(S.arrows,id,v[idx]));

function tidy(){
  let c=computeContacts(S.pieces);
  const touched=new Set(); c.forEach(x=>{touched.add(x.a);touched.add(x.b);});
  let changed=false;
  S.pieces.forEach(p=>{if(touched.has(p.id)||remoteDrag.has(p.id))return;if(p.h0&&p.h!==p.h0){p.h=p.h0;changed=true;}if(p.w0&&p.w!==p.w0){p.w=p.w0;changed=true;}});
  if(changed) c=computeContacts(S.pieces);
  const ks=new Set(c.map(x=>x.key));
  Object.keys(S.meta).forEach(k=>{if(ks.has(k))return;const [a,b]=k.split('|');if(remoteDrag.has(a)||remoteDrag.has(b))return;delete S.meta[k];});
}
function commit(prune=true){
  if(sync.readOnly){pendingBefore=null;revertToRemote();toast('Tu peux regarder la partie, pas la modifier : demande à l’organisateur de te passer Contributeur.');return Promise.resolve();}
  if(prune)tidy();S.arrows=S.arrows.filter(a=>byId(a.from)&&byId(a.to));
  if(!applyingHist) recordHistory();
  renderAll();save();
  return pushRemote();
}

/* ---------- Partie ---------- */
function seeded(str){let h=2166136261;for(const c of String(str))h=Math.imul(h^c.charCodeAt(0),16777619);return ()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
function shuffleLayout(list,rnd=Math.random){
  const arr=list.map(p=>[rnd(),p]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  arr.forEach(p=>{if(p.h0)p.h=p.h0;if(p.w0)p.w=p.w0;});
  const maxW=Math.max(4800,Math.sqrt(arr.reduce((s,p)=>s+(p.w+340)*(p.h+340),0))*1.5);
  let x=0,y=0,rowH=0;
  for(const p of arr){
    if(x>0&&x+p.w>maxW){x=0;y+=rowH+300;rowH=0;}
    p.x=Math.round(x+rnd()*70); p.y=Math.round(y+rnd()*70);
    x+=p.w+340; rowH=Math.max(rowH,p.h);
  }
}
function newGame(){S={pieces:clone(BASE),meta:{},arrows:[]};shuffleLayout(S.pieces);}
function doShuffle(){
  pushHistory(); shuffleLayout(S.pieces); S.meta={}; S.arrows=[]; sel=null; commit(); fitView();
  toast('Pièces mélangées. Jonctions et flèches remises à zéro.',true);
}
function doSolution(){
  pushHistory();
  const custom=S.pieces.filter(p=>!BASE_IDS.has(p.id));
  let y=417; custom.forEach(p=>{p.h=p.h0||p.h;p.w=p.w0||p.w;p.x=-900-p.w;p.y=y;y+=p.h+260;});
  S={pieces:[...clone(BASE),...custom],meta:clone(SOL_META),arrows:clone(SOL_ARROWS)}; sel=null; commit(false); fitView();
  toast('Voici la carte du design.',true);
}
function verify(){
  const solP=Object.fromEntries(BASE.map(p=>[p.id,p]));
  const solC=computeContacts(BASE), cur=new Set(computeContacts(S.pieces).map(c=>c.key));
  let asm=0,rel=0;
  const okKey=new Set();
  for(const c of solC){
    const [a,b]=c.key.split('|'), A=byId(a), B=byId(b);
    if(!(cur.has(c.key)&&A&&B)) continue;
    // même voisin, du même côté : la hauteur peut avoir bougé, on compare le côté de contact
    const sideSol=edgeContact(solP[a],solP[b]).sa, now=edgeContact(A,B);
    if(now&&now.sa===sideSol){asm++;okKey.add(c.key);}
  }
  for(const [k,m] of SOL_REL) if(okKey.has(k)&&S.meta[k]&&S.meta[k].type===m.type) rel++;
  const arr=SOL_ARROWS.filter(s=>S.arrows.some(a=>a.from===s.from&&a.to===s.to&&a.kw===s.kw)).length;
  return {asm,asmTot:solC.length,rel,relTot:SOL_REL.length,arr,arrTot:SOL_ARROWS.length};
}
function updateProgress(){const v=verify();$('progTxt').textContent=`${v.asm} / ${v.asmTot} assemblages`;}
function doVerify(){
  const v=verify(), all=v.asm===v.asmTot&&v.rel===v.relTot&&v.arr===v.arrTot;
  toast(all?'Carte reconstituée : assemblages, jonctions et flèches sont justes.':`Assemblages ${v.asm}/${v.asmTot} · Jonctions ${v.rel}/${v.relTot} · Flèches ${v.arr}/${v.arrTot}`);
}

function select(s){sel=s;closePop();renderOverlay();renderSelbar();sendPresence({sel:s&&s.type==='piece'?s.id:null});}
/* Cherche, en spirale autour de la place visée, un endroit où le groupe ne touche aucune autre carte */
const FREE_GAP=90;
function clashes(rects,ignore){
  return rects.some(r=>S.pieces.some(o=>!ignore.has(o.id)&&o.x<r.x+r.w+FREE_GAP&&r.x<o.x+o.w+FREE_GAP&&o.y<r.y+r.h+FREE_GAP&&r.y<o.y+o.h+FREE_GAP));
}
function findFree(ids,prefAngle){
  const G=new Set(ids), base=[...G].map(id=>byId(id)).filter(Boolean);
  if(!clashes(base,G)) return {dx:0,dy:0};
  const a0=prefAngle==null?0:prefAngle;
  for(let r=140;r<=6000;r+=140){
    const n=Math.max(8,Math.round(r/90));
    for(let k=0;k<n;k++){
      const a=a0+(k%2?1:-1)*Math.ceil(k/2)*(2*Math.PI/n);
      const dx=Math.round(Math.cos(a)*r), dy=Math.round(Math.sin(a)*r);
      if(!clashes(base.map(p=>({x:p.x+dx,y:p.y+dy,w:p.w,h:p.h})),G)) return {dx,dy};
    }
  }
  return {dx:0,dy:0};
}
function moveToFree(ids,prefAngle){const d=findFree(ids,prefAngle);ids.forEach(id=>{const p=byId(id);if(p){p.x+=d.dx;p.y+=d.dy;}});return d;}
function nudgeFree(p){moveToFree([p.id],0);}
function deletePiece(id){pushHistory();S.pieces=S.pieces.filter(p=>p.id!==id);S.arrows=S.arrows.filter(a=>a.from!==id&&a.to!==id);sel=null;commit();}
function duplicatePiece(id){
  const p=byId(id); if(!p) return; pushHistory();
  const c=clone(p); c.id=uid('u'); c.h=c.h0||c.h; c.w=c.w0||c.w; c.x=p.x+p.w+260; nudgeFree(c); S.pieces.push(c); sel={type:'piece',id:c.id}; commit();
}
function detachPiece(id){
  const G=groupOf(id); if(G.size<2) return; pushHistory();
  const p=byId(id), others=S.pieces.filter(o=>G.has(o.id)&&o.id!==id);
  const cx=others.reduce((s,o)=>s+o.x+o.w/2,0)/others.length, cy=others.reduce((s,o)=>s+o.y+o.h/2,0)/others.length;
  const ang=Math.atan2(p.y+p.h/2-cy,p.x+p.w/2-cx);
  p.x=Math.round(p.x+Math.cos(ang)*(SNAP+60)); p.y=Math.round(p.y+Math.sin(ang)*(SNAP+60));
  moveToFree([p.id],ang);
  commit();
}
function deleteSel(){
  if(!sel) return;
  if(sel.type==='piece') deletePiece(sel.id);
  else {pushHistory();S.arrows=S.arrows.filter(a=>a.id!==sel.id);sel=null;commit();}
}
function renderSelbar(){

      ${inGroup?'<button class="btn" data-act="detach">Détacher</button>':''}<button class="btn" data-act="del">Supprimer</button>`;

    bar.innerHTML=Object.entries(KW).map(([k,v])=>`<button class="chip${a.kw===k?' on':''}" data-kw="${k}"><i style="background:${v.line}"></i>${v.word}</button>`).join('')+

$('selbar').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!sel) return;
  if(b.dataset.kw){const a=S.arrows.find(x=>x.id===sel.id);if(a&&a.kw!==b.dataset.kw){pushHistory();a.kw=b.dataset.kw;commit();}return;}
  const act=b.dataset.act;
  if(sel.type==='piece'){
    if(act==='edit') openEditor(sel.id); else if(act==='dup') duplicatePiece(sel.id); else if(act==='detach') detachPiece(sel.id); else if(act==='del') deletePiece(sel.id);
  }else{
    const a=S.arrows.find(x=>x.id===sel.id); if(!a) return;
    if(act==='del'){deleteSel();return;}
    pushHistory(); if(act==='flip') a.flip=!a.flip; if(act==='swap') swapArrow(a); if(act==='straight'){delete a.route;delete a.as;delete a.ae;} commit();
  }
});

function openJunctionPop(k){

function closePop(){if($('pop').hidden)return;$('pop').hidden=true;renderSelbar();}
$('pop').addEventListener('click',e=>{

/* ---------- Aperçu d'emboîtement : les bords se changent en encoches ---------- */
function setHint(sn){
  if(!sn){ if(hint){hint.target=0;hint.lastSn=null;animHint();} return; }
  const A2=sn.A2, B=byId(sn.b), c=sn.c, u=(c.o0+c.o1)/2;
  const st=P=>c.axis==='y'?P.y:P.x;
  const id=`${sn.a}|${sn.b}|${c.sa}`;
  if(!hint||hint.id!==id){
    hint={id,a:sn.a,b:sn.b,sa:c.sa,sb:c.sb,pa:u-st(A2),pb:u-st(B),r:hint&&hint.id===id?hint.r:0,target:R,t0:performance.now(),from:0};
  }else{hint.pa=u-st(A2);hint.pb=u-st(B);hint.target=R;}
  animHint();
}
let animRaf=0;
function animHint(){
  if(animRaf) return;
  const tick=()=>{
    animRaf=0; if(!hint) return;
    const goal=hint.target, d=goal-hint.r;
    hint.r=Math.abs(d)<.8?goal:hint.r+d*.28;
    if(hint.r<=.5&&goal===0){hint=null;}
    const c=computeContacts(S.pieces); renderPieces(c); renderOverlay(c);
    if(hint&&hint.r!==hint.target) animRaf=requestAnimationFrame(tick);
  };
  animRaf=requestAnimationFrame(tick);
}

const vp=$('vp');
const capture=e=>{try{vp.setPointerCapture(e.pointerId);}catch(_){}};
function startPieceDrag(e,pid){
  const solo=e.altKey, contacts=computeContacts(S.pieces);
  const G=solo?new Set([pid]):groupOf(pid,contacts);
  S.pieces=[...S.pieces.filter(p=>!G.has(p.id)),...S.pieces.filter(p=>G.has(p.id))];
  sel={type:'piece',id:pid};
  const start=new Map([...G].map(id=>{const p=byId(id);return [id,{x:p.x,y:p.y}];}));
  drag={kind:'piece',pid,G,start,sx:e.clientX,sy:e.clientY,moved:false,snap:null,before:snapshot(),resizable:resizableIn(G,contacts)};
  if(e.pointerType==='touch'&&!solo){
    drag.lp=setTimeout(()=>{
      if(drag&&drag.kind==='piece'&&!drag.moved){
        drag.G=new Set([pid]); drag.start=new Map([[pid,{x:byId(pid).x,y:byId(pid).y}]]); drag.resizable=new Set([pid]);
        els.get(pid)&&els.get(pid).classList.add('lift'); try{navigator.vibrate&&navigator.vibrate(12);}catch(_){}
        toast('Pièce sortie de son groupe');
      }
    },450);
  }
  renderPieces(contacts); renderOverlay(contacts); renderSelbar();
}
/* Une carte du groupe peut changer de hauteur si rien n'est collé au-dessus ou au-dessous d'elle */
function resizableIn(G,contacts){
  if(G.size===1) return new Set(G);
  const ok=new Set(G);
  contacts.forEach(c=>{if(G.has(c.a)&&G.has(c.b)&&c.axis==='x'){ok.delete(c.a);ok.delete(c.b);}});
  return ok;
}
vp.addEventListener('pointerdown',e=>{
  if(!$('modal').hidden) return;
  closePop();
  if(e.pointerType==='touch'){
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});

      if(drag&&drag.kind==='piece'){clearTimeout(drag.lp);drag.G.forEach(id=>{const s=drag.start.get(id),p=byId(id);p.x=s.x;p.y=s.y;els.get(id)&&els.get(id).classList.remove('lift');});hint=null;}
      const [a,b]=[...touches.values()];
      pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,view:{...view}}; drag=null; renderAll(); return;
    }
  }

let raf=0;
vp.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'&&touches.has(e.pointerId)) touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(e.pointerType!=='touch'||drag){const w=toWorld(e.clientX,e.clientY);sendPresence({x:Math.round(w.x),y:Math.round(w.y)});}
  if(pinch&&touches.size>=2){
    const [a,b]=[...touches.values()], d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const s2=clamp(pinch.view.s*d/pinch.d,.04,2), wx=(pinch.mx-pinch.view.tx)/pinch.view.s, wy=(pinch.my-pinch.view.ty)/pinch.view.s;
    view={s:s2,tx:mx-wx*s2,ty:my-wy*s2}; userView=true; applyView(); return;
  }
  if(!drag){
    if(e.pointerType==='mouse'){const hd=e.target.closest&&e.target.closest('.hd');const P=hd?byId(hd.dataset.hpid):pieceAt(toWorld(e.clientX,e.clientY));setHover(P?P.id:null);}
    return;
  }
  if(drag.kind==='pan'){userView=true;view.tx=drag.tx+e.clientX-drag.sx;view.ty=drag.ty+e.clientY-drag.sy;applyView();return;}
  if(drag.kind==='link'){
    drag.cur=toWorld(e.clientX,e.clientY);
    if(drag.pen){const l=drag.pts[drag.pts.length-1];if(Math.hypot(drag.cur.x-l.x,drag.cur.y-l.y)>10/view.s&&drag.pts.length<600)drag.pts.push(drag.cur);}
    const T=pieceAt(drag.cur,drag.from); drag.target=T?T.id:null;
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;renderOverlay();});return;
  }
  if(drag.kind==='piece'){
    const dxs=e.clientX-drag.sx, dys=e.clientY-drag.sy;
    if(!drag.moved){if(Math.hypot(dxs,dys)<4)return;drag.moved=true;clearTimeout(drag.lp);drag.G.forEach(id=>els.get(id)&&els.get(id).classList.add('lift'));$('selbar').hidden=true;}
    const dx=dxs/view.s, dy=dys/view.s;
    drag.G.forEach(id=>{const s=drag.start.get(id),p=byId(id);p.x=s.x+dx;p.y=s.y+dy;});
    if(drag.G.size<=24) sendPresence({drag:[...drag.G].map(id=>{const p=byId(id);return [id,Math.round(p.x),Math.round(p.y)];})});
    if(!raf)raf=requestAnimationFrame(()=>{
      raf=0; if(!drag||drag.kind!=='piece') return;
      drag.snap=findSnap(drag.G,drag.resizable); setHint(drag.snap);
      const c=computeContacts(S.pieces); renderPieces(c); renderOverlay(c);
    });
  }
});
function endPointer(e){
  if(e.pointerType==='touch'){touches.delete(e.pointerId);if(pinch){if(touches.size<2)pinch=null;return;}}
  if(!drag) return;
  const d=drag; drag=null; vp.classList.remove('panning');
  if(d.kind==='piece'){
    clearTimeout(d.lp); hint=null;
    d.G.forEach(id=>els.get(id)&&els.get(id).classList.remove('lift'));
    if(!d.moved){renderAll();sendPresence({drag:null});return;}
    const before=new Set(computeContacts(JSON.parse(d.before).pieces).map(c=>c.key));
    const sn=findSnap(d.G,d.resizable);
    d.G.forEach(id=>{const p=byId(id);if(sn){if(id===sn.a){p.x=sn.A2.x;p.y=sn.A2.y;p.w=sn.A2.w;p.h=sn.A2.h;}else{p.x+=sn.dx;p.y+=sn.dy;}}else{p.x=Math.round(p.x);p.y=Math.round(p.y);}});
    if(!sn){
      const mv=[...d.G].map(byId), others=S.pieces.filter(o=>!d.G.has(o.id));
      const hit=others.find(o=>mv.some(m=>overlap(m,o)));
      if(hit){
        const gx=mv.reduce((a,m)=>a+m.x+m.w/2,0)/mv.length, gy=mv.reduce((a,m)=>a+m.y+m.h/2,0)/mv.length;
        const ang=Math.atan2(gy-(hit.y+hit.h/2),gx-(hit.x+hit.w/2));
        moveToFree([...d.G],ang);
        d.G.forEach(id=>{const el=els.get(id);if(el){el.classList.add('snapping');setTimeout(()=>el.classList.remove('snapping'),200);}});
      }
    }
    if(sn) d.G.forEach(id=>{const el=els.get(id);if(el){el.classList.add('snapping');setTimeout(()=>el.classList.remove('snapping'),200);}});
    const fresh=computeContacts(S.pieces).filter(c=>!before.has(c.key)&&(d.G.has(c.a)!==d.G.has(c.b)));
    fresh.forEach(c=>{const owner=d.G.has(c.a)?c.a:c.b;S.meta[c.key]={...(S.meta[c.key]||{}),joint:owner,ju:(c.o1-c.o0)/2};});
    pushHistory(d.before); commit().then(()=>sendPresence({drag:null}),()=>sendPresence({drag:null}));
    if(fresh.length) setTimeout(()=>openJunctionPop(fresh[0].key),200);
  }else if(d.kind==='link'){
    const T=d.target?byId(d.target):pieceAt(toWorld(e.clientX,e.clientY),d.from);
    finishLink(d.from,T&&T.id,d.pen?[...d.pts,toWorld(e.clientX,e.clientY)]:null);
  }
}

  if(e.key==='+'||e.key==='='){e.preventDefault();userView=true;zoomAt(innerWidth/2,innerHeight/2,1.25);}

  if(e.ctrlKey||e.metaKey) zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.012));
  else{view.tx-=e.deltaX;view.ty-=e.deltaY;applyView();}
},{passive:false});

/* ---------- Poser une flèche : poignées, carte visée, choix du mot ---------- */
/* la carte sous un point du plateau, celle du dessus d'abord (on ne demande pas au navigateur : une flèche ou une pastille pourrait masquer la carte) */
function pieceAt(w,except){for(let i=S.pieces.length-1;i>=0;i--){const p=S.pieces[i];if(p.id!==except&&w.x>=p.x-8&&w.x<=p.x+p.w+8&&w.y>=p.y-8&&w.y<=p.y+p.h+8)return p;}return null;}
let hoverPid=null, hoverOff=0;
function handlePid(){if(drag||!$('modal').hidden)return null;return hoverPid||(sel&&sel.type==='piece'?sel.id:null);}
function renderHandles(){
  const L=$('handles'); if(!L) return;
  const p=byId(handlePid()); let html='';
  if(p){
    const pts=[[p.x+p.w/2,p.y,0,-1],[p.x+p.w,p.y+p.h/2,1,0],[p.x+p.w/2,p.y+p.h,0,1],[p.x,p.y+p.h/2,-1,0]];
    html=pts.map(([x,y,dx,dy])=>{const sp=toScreen(x,y);return `<button class="hd" data-hpid="${p.id}" style="left:${(sp.x+dx*18).toFixed(1)}px;top:${(sp.y+dy*18).toFixed(1)}px" title="Tirer une flèche vers une autre carte" aria-label="Tirer une flèche depuis cette carte"></button>`;}).join('');
  }
  if(L._html!==html){L._html=html;L.innerHTML=html;}
}
function setHover(pid){
  if(pid){clearTimeout(hoverOff);hoverOff=0;if(pid!==hoverPid){hoverPid=pid;renderHandles();}}
  else if(hoverPid&&!hoverOff){hoverOff=setTimeout(()=>{hoverOff=0;hoverPid=null;renderHandles();},450);}
}
function arrowMid(a){
  const g=arrowGeom(a); if(!g) return null;
  if(a.route&&a.route.length){const P=routedPoints(a,g);return P[Math.floor(P.length/2)];}
  const t=.5,u=.5; return {x:u*u*u*g.s.x+3*u*u*t*g.t1.x+3*u*t*t*g.t2.x+t*t*t*g.e.x, y:u*u*u*g.s.y+3*u*u*t*g.t1.y+3*u*t*t*g.t2.y+t*t*t*g.e.y};
}
function openArrowPop(aid,sx,sy){
  const a=S.arrows.find(x=>x.id===aid); if(!a) return;
  if(sx==null){const m=arrowMid(a);if(!m)return;const sp=toScreen(m.x,m.y);sx=sp.x;sy=sp.y;}
  const A=byId(a.from), pop=$('pop');
  pop.innerHTML=`<span class="lbl">${esc((A&&A.title)||'Cette carte')}…</span>`+
    Object.entries(KW).map(([k,v])=>`<button class="chip${a.kw===k?' on':''}" data-akw="${k}"><i style="background:${v.line}"></i>${v.word}</button>`).join('')+
    (a.route?`<button class="btn" data-aact="straight" title="Redresser la flèche">Redresser</button>`:'')+
    `<button class="btn" data-aact="swap" title="Inverser le sens">⇄</button><button class="btn" data-aact="del" title="Supprimer la flèche">Supprimer</button>`;
  pop.dataset.mode='arrow'; pop.dataset.aid=aid; pop.hidden=false; $('selbar').hidden=true;
  const r=pop.getBoundingClientRect();
  pop.style.left=clamp(sx-r.width/2,12,innerWidth-r.width-12)+'px';
  pop.style.top=(sy+56+r.height<innerHeight-90?sy+56:clamp(sy-r.height-56,12,innerHeight-r.height-12))+'px';
}
/* le tracé est gardé relatif aux deux bouts : la flèche garde sa forme quand les cartes bougent */
function simplify(pts,tol){
  if(pts.length<3) return pts.slice();
  const seg=(p,a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy||1;let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L;t=clamp(t,0,1);return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy);};
  let iMax=0,dMax=0;for(let i=1;i<pts.length-1;i++){const d=seg(pts[i],pts[0],pts[pts.length-1]);if(d>dMax){dMax=d;iMax=i;}}
  if(dMax<=tol) return [pts[0],pts[pts.length-1]];
  const l=simplify(pts.slice(0,iMax+1),tol), r=simplify(pts.slice(iMax),tol); return [...l.slice(0,-1),...r];
}
function routeFrom(a,pts){
  const RA=grow(byId(a.from),GAP), RB=grow(byId(a.to),GAP);
  const inside=(r,p)=>p.x>r.x1&&p.x<r.x2&&p.y>r.y1&&p.y<r.y2;
  /* là où le trait quitte la première carte, là où il entre dans la seconde */
  const iOut=pts.findIndex(p=>!inside(RA,p)); if(iOut<1) return null;
  let iIn=-1; for(let i=iOut;i<pts.length;i++) if(inside(RB,pts[i])){iIn=i;break;}
  if(iIn<1) return null;
  const sPt=exitPt(RA,pts[iOut-1],pts[iOut]), ePt=exitPt(RB,pts[iIn],pts[iIn-1]);
  a.as=anchorOf(RA,sPt); a.ae=anchorOf(RB,ePt);
  const g={s:anchorPt(RA,a.as),e:anchorPt(RB,a.ae)};
  const mid=simplify([g.s,...pts.slice(iOut,iIn).filter(p=>!inside(RA,p)&&!inside(RB,p)),g.e],40).slice(1,-1).slice(0,12);
  const d={x:g.e.x-g.s.x,y:g.e.y-g.s.y}, L2=d.x*d.x+d.y*d.y; if(L2<1||!mid.length){delete a.as;delete a.ae;return null;}
  const r=mid.map(p=>{const q={x:p.x-g.s.x,y:p.y-g.s.y};return [+((q.x*d.x+q.y*d.y)/L2).toFixed(3),+((q.x*-d.y+q.y*d.x)/L2).toFixed(3)];})
    .filter(([u])=>u>0.04&&u<0.96);
  return r.length?r:null;
}
function swapArrow(a){const f=a.from;a.from=a.to;a.to=f;if(a.route){a.route=a.route.map(([u,v])=>[+(1-u).toFixed(3),-v]).reverse();const t=a.as;a.as=a.ae;a.ae=t;}}
function finishLink(from,to,pts){
  if(!to||to===from||!byId(from)||!byId(to)){renderOverlay();return;}
  pushHistory();
  const a={id:uid('a'),from,to,kw:'permet',flip:false};
  if(pts&&pts.length>3){const r=routeFrom(a,pts);if(r)a.route=r;else{delete a.as;delete a.ae;}}
  S.arrows.push(a); sel={type:'arrow',id:a.id}; commit();
  setTimeout(()=>openArrowPop(a.id),60);
}

/* ---------- Clic droit ---------- */
const MOD=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)?'⌘':'Ctrl ';
let ctxPlace=null;
function closeCtx(){$('ctx').hidden=true;}
function openCtx(x,y,items){
  const m=$('ctx');
  m.innerHTML=items.map((it,i)=>it==='-'?'<div class="sp"></div>':it.hd?`<div class="hd">${esc(it.hd)}</div>`:
    `<button class="it${it.on?' on':''}${it.danger?' danger':''}" role="menuitem" data-i="${i}">${it.sw?`<i style="background:${it.sw}"></i>`:''}${it.dot?`<span class="dot"></span>`:''}<span>${esc(it.label)}</span>${it.k?`<span class="k">${esc(it.k)}</span>`:''}</button>`).join('');
  m.hidden=false;
  const r=m.getBoundingClientRect();
  m.style.left=clamp(x,8,innerWidth-r.width-8)+'px'; m.style.top=clamp(y,8,innerHeight-r.height-8)+'px';
  m.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const it=items[+b.dataset.i];closeCtx();it.run&&it.run();};
  const f=m.querySelector('.it'); f&&f.focus({preventScroll:true});
}
function startLinkFrom(pid){
  setTool('link'); drag={kind:'link',from:pid,cur:null,target:null,pending:true}; sel=null; renderSelbar();
  toast('Clique sur la carte à relier. Échap pour annuler.');
}
vp.addEventListener('contextmenu',e=>{
  e.preventDefault(); if(!$('modal').hidden) return;
  closePop();
  const t=e.target, bk=t.closest&&t.closest('.badge'), pidEl=t.closest&&t.closest('[data-pid]'), aidEl=t.closest&&t.closest('[data-aid]');
  const wpos=toWorld(e.clientX,e.clientY);
  if(bk){
    const k=bk.dataset.k, cur=S.meta[k]&&S.meta[k].type;
    const setT=v=>()=>{pushHistory();S.meta[k]=S.meta[k]||{};if(v)S.meta[k].type=v;else delete S.meta[k].type;commit();};
    openCtx(e.clientX,e.clientY,[{hd:'Cette pièce…'},{label:'EXIGE sa voisine',dot:1,on:cur==='EXIGE',run:setT('EXIGE')},{label:'PERMET sa voisine',dot:1,on:cur==='PERMET',run:setT('PERMET')},{label:'Aucune relation',on:!cur,run:setT('')}]);
    return;
  }
  if(aidEl){
    const a=S.arrows.find(x=>x.id===aidEl.dataset.aid); if(!a) return;
    select({type:'arrow',id:a.id});
    const upd=f=>()=>{pushHistory();f(a);commit();};
    openCtx(e.clientX,e.clientY,[{hd:'Flèche'},
      ...Object.entries(KW).map(([k,v])=>({label:v.word,sw:v.line,on:a.kw===k,run:upd(x=>{x.kw=k;})})),'-',
      {label:'Inverser le sens',run:upd(swapArrow)},
      {label:'Changer de côté',run:upd(x=>{x.flip=!x.flip;})},
      ...(a.route?[{label:'Redresser la flèche',run:upd(x=>{delete x.route;delete x.as;delete x.ae;})}]:[]),'-',
      {label:'Supprimer la flèche',k:'⌫',danger:1,run:deleteSel}]);
    return;
  }
  if(pidEl){
    const pid=pidEl.dataset.pid, p=byId(pid); if(!p) return;
    select({type:'piece',id:pid});
    const inGroup=groupOf(pid).size>1;
    openCtx(e.clientX,e.clientY,[{hd:(p.num?p.num+' · ':'')+p.title},
      {label:'Modifier',k:'Entrée',run:()=>openEditor(pid)},
      {label:'Dupliquer',k:MOD+'D',run:()=>duplicatePiece(pid)},
      ...(inGroup?[{label:'Détacher du groupe',k:'⌥ glisser',run:()=>detachPiece(pid)}]:[]),
      {label:'Relier à une autre carte',k:'L',run:()=>startLinkFrom(pid)},'-',
      {label:'Supprimer',k:'⌫',danger:1,run:()=>deletePiece(pid)}]);
    return;
  }
  ctxPlace=wpos;
  openCtx(e.clientX,e.clientY,[
    {label:'Nouvelle pièce ici',k:'N',run:()=>openEditor(null)},
    {label:tool==='link'?'Revenir à Déplacer':'Outil plume',k:tool==='link'?'V':'P',run:()=>setTool(tool==='link'?'move':'link')},'-',
    {label:'Ajuster la vue',k:'0',run:fitView},
    {label:'Zoomer',k:MOD+'+',run:()=>{userView=true;zoomAt(e.clientX,e.clientY,1.25);}},
    {label:'Dézoomer',k:MOD+'−',run:()=>{userView=true;zoomAt(e.clientX,e.clientY,.8);}},'-',
    {label:'Annuler',k:MOD+'Z',run:undo},
    {label:'Vérifier ma carte',run:doVerify},
    {label:'Mélanger les pièces',run:doShuffle},
    {label:'Voir la solution',run:doSolution}]);
});
window.addEventListener('pointerdown',e=>{if(!$('ctx').hidden&&!e.target.closest('#ctx'))closeCtx();},true);
window.addEventListener('blur',closeCtx);

/* ---------- Clavier ---------- */
const typing=e=>/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
window.addEventListener('keydown',e=>{
  if(!$('ctx').hidden){
    if(e.key==='Escape'){closeCtx();return;}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const its=[...$('ctx').querySelectorAll('.it')],i=its.indexOf(document.activeElement);(its[(i+(e.key==='ArrowDown'?1:-1)+its.length)%its.length]||its[0]).focus();return;}
  }
  if(e.key==='Escape'){closePop();if(!$('modal').hidden){closeModal();return;}if(drag&&drag.kind==='link'){drag=null;renderOverlay();}setTool('move');if(sel)select(null);return;}
  if(!$('modal').hidden||typing(e)) return;
  const mod=e.metaKey||e.ctrlKey, k=e.key.toLowerCase();
  if(e.key===' '){spaceDown=true;vp.classList.add('space');e.preventDefault();return;}
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==='y'){e.preventDefault();redo();return;}
  if(mod&&k==='d'){e.preventDefault();if(sel&&sel.type==='piece')duplicatePiece(sel.id);return;}
  if(mod) return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSel();}
  else if(k==='v') setTool('move');
  else if(k==='l'||k==='p') setTool(tool==='link'?'move':'link');
  else if(k==='n') openEditor(null);
  else if(e.key==='Enter'&&sel&&sel.type==='piece') openEditor(sel.id);
  else if(e.key==='+'||e.key==='=') zoomAt(innerWidth/2,innerHeight/2,1.25);
  else if(e.key==='-') zoomAt(innerWidth/2,innerHeight/2,.8);
  else if(e.key==='0') fitView();
});
window.addEventListener('keyup',e=>{if(e.key===' '){spaceDown=false;vp.classList.remove('space');}});

$('tMove').onclick=()=>setTool('move');
$('tLink').onclick=()=>setTool(tool==='link'?'move':'link');
$('bAdd').onclick=()=>openEditor(null);
$('bShuffle').onclick=doShuffle;
$('bSolution').onclick=doSolution;
$('bVerify').onclick=doVerify;
$('zIn').onclick=()=>{userView=true;zoomAt(innerWidth/2,innerHeight/2,1.25);};
$('zOut').onclick=()=>{userView=true;zoomAt(innerWidth/2,innerHeight/2,.8);};
$('zFit').onclick=fitView;
$('bUndo').onclick=undo;
$('bRedo').onclick=redo;

if(window.PUZZLE_ONLINE){$('bShare').hidden=false;$('bData').hidden=true;}

/* ---------- Toast ---------- */
let toastT=0;
function toast(msg,withUndo=false){
  const t=$('toast'); t.innerHTML=`<span>${esc(msg)}</span>${withUndo?'<button type="button" id="tUndo">Annuler</button>':''}`;
  t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true;},withUndo?6000:3600);
  if(withUndo) $('tUndo').onclick=()=>{undo();t.hidden=true;};
}

/* ---------- Fenêtres ---------- */
function openModal(html){const m=$('modal');m.innerHTML=html;m.hidden=false;}
function closeModal(){$('modal').hidden=true;$('modal').innerHTML='';editor=null;}
$('modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')closeModal();});

/* Création et modification : on écrit sur la carte elle-même */
function openEditor(id){
  const src=id?byId(id):null;
  const d=src?clone(src):{id:'apercu',num:'',title:'',desc:'',src:'',color:'#9F0049',x:0,y:0,w:445,h:530,h0:530,w0:445};
  if(src){d.h=src.h0||src.h;d.w=src.w0||src.w;}
  editor={id,d};
  const fmtKey=()=>Object.keys(FORMATS).find(k=>FORMATS[k].w===d.w&&FORMATS[k].h===d.h)||'';
  openModal(`<div class="sheet ed" role="dialog" aria-modal="true" aria-labelledby="edT">
    <div class="ed-stage"><div class="ed-card" id="edCard"></div>
      <div class="hint">Cliquez sur un texte de la carte pour l’écrire. Le texte se resserre tout seul s’il manque de place.</div></div>
    <div class="ed-side">
      <h2 id="edT">${id?'Modifier la pièce':'Nouvelle pièce'}</h2>
      <div class="blk"><span class="lab">Couleur</span><div class="fams" id="fColors">${FAMILIES.map(f=>`<div class="fam"><i style="background:${f.deep}" title="${f.n}"></i>${f.c.map(c=>`<button type="button" class="sw${c===d.color?' on':''}" data-c="${c}" style="background:${c}" aria-label="${f.n} ${c}"></button>`).join('')}</div>`).join('')}</div></div>
      <div class="blk"><span class="lab">Taille</span><div class="fmts" id="fFormat">${Object.entries(FORMATS).map(([k,v])=>{const s=34/Math.max(v.w,v.h*1.2);return `<button type="button" class="fmt${fmtKey()===k?' on':''}" data-f="${k}"><span class="box" style="width:${Math.round(v.w*s)}px;height:${Math.round(v.h*s)}px"></span>${v.n}</button>`;}).join('')}</div>
        <span class="hint">Collée à côté d’une autre carte, la pièce prend sa hauteur pour que les bords tombent juste.</span></div>
      <div class="acts"><button type="button" class="btn" id="edCancel">Annuler</button><button type="button" class="btn wine" id="edSave">${id?'Enregistrer':'Poser sur le plateau'}</button></div>
    </div>
  </div>`);
  $('fColors').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;readEd();d.color=b.dataset.c;$('fColors').querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b));renderEdCard(false);};
  $('fFormat').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;readEd();const F=FORMATS[b.dataset.f];d.w=F.w;d.h=F.h;d.h0=F.h;d.w0=F.w;$('fFormat').querySelectorAll('.fmt').forEach(x=>x.classList.toggle('on',x===b));renderEdCard(false);};
  $('edCancel').onclick=closeModal;
  $('edSave').onclick=()=>{readEd();saveEditor();};
  renderEdCard(true);
}
function readEd(){
  const card=$('edCard'); if(!card||!editor) return;
  card.querySelectorAll('[data-f]').forEach(el=>{
    const v=el.innerText.replace(/ /g,' ').replace(/\n{3,}/g,'\n\n');
    const f={num:'num',ttl:'title',dsc:'desc',src:'src'}[el.dataset.f];
    editor.d[f]=f==='desc'?v.trim():v.replace(/\n/g,' ').trim();
  });
}
function renderEdCard(focus){
  const d=editor.d, card=$('edCard'), stage=card.parentElement;
  const availW=Math.max(240,Math.min(560,stage.clientWidth-56)), availH=Math.max(260,Math.min(520,innerHeight*.62));
  const s=Math.min(availW/d.w,availH/d.h,1.1);
  card.style.width=d.w*s+'px'; card.style.height=d.h*s+'px';
  card.innerHTML=`<div class="piece" style="width:${d.w}px;height:${d.h}px;transform:scale(${s});transform-origin:0 0">${pieceInner(d,EMPTY,true)}</div>`;
  const pc=card.firstElementChild, pb=pads(d,EMPTY).pb;
  const refit=()=>fitText(pc,d,pb);
  card.querySelectorAll('[contenteditable]').forEach(el=>{
    if(el.contentEditable!=='plaintext-only') el.contentEditable='true';
    el.addEventListener('input',()=>{if(!el.textContent)el.innerHTML='';refit();});
    el.addEventListener('paste',ev=>{ev.preventDefault();const t=(ev.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t);});
    el.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'&&(el.dataset.f!=='dsc'||ev.metaKey||ev.ctrlKey)){
        ev.preventDefault();
        if(ev.metaKey||ev.ctrlKey){readEd();saveEditor();return;}
        const all=[...card.querySelectorAll('[contenteditable]')], i=all.indexOf(el); (all[i+1]||all[0]).focus();
      }
    });
  });
  refit();
  if(focus){const t=card.querySelector('[data-f="ttl"]');setTimeout(()=>{t.focus();const r=document.createRange();r.selectNodeContents(t);r.collapse(false);const sl=getSelection();sl.removeAllRanges();sl.addRange(r);},40);}
}
function saveEditor(){
  const d=editor.d;
  if(!d.title){const t=$('edCard').querySelector('[data-f="ttl"]');t.dataset.ph='Donnez un titre à la pièce';t.focus();return;}
  pushHistory();
  if(editor.id){
    const p=byId(editor.id), same=(p.w0||p.w)===d.w0&&p.h0===d.h0;
    Object.assign(p,{num:d.num,title:d.title,desc:d.desc,src:d.src,color:d.color,h0:d.h0,w0:d.w0});
    if(!same){p.h=d.h0;p.w=d.w0;}
    sel={type:'piece',id:p.id};
  }else{
    const c=ctxPlace||toWorld(innerWidth/2,innerHeight/2); ctxPlace=null;
    const p={id:uid('u'),num:d.num,title:d.title,desc:d.desc,src:d.src,color:d.color,w:d.w0,w0:d.w0,h:d.h0,h0:d.h0,x:Math.round(c.x-d.w/2),y:Math.round(c.y-d.h0/2)};
    nudgeFree(p); S.pieces.push(p); sel={type:'piece',id:p.id};
  }
  closeModal(); commit();
  const p=byId(sel.id), sp=toScreen(p.x+p.w/2,p.y+p.h/2);
